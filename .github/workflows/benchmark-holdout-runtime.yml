name: MINIRONIN — holdout pareado 400k vs 450k (100 preguntas, sin KV cache)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/benchmark-holdout-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: orbitalronin94/MINIRONIN
      BASE_TAG: minironin-transformer-10m-step-400000-parent
      CANDIDATE_TAG: minironin-transformer-10m-step-450000-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Descargar y verificar ambos checkpoints
        run: |
          set -euo pipefail
          mkdir -p .tmp/holdout/base .tmp/holdout/candidate
          gh release download "$BASE_TAG" --repo "$REPOSITORY" --pattern "checkpoint-400000.pt" --dir .tmp/holdout/base
          gh release download "$CANDIDATE_TAG" --repo "$REPOSITORY" --pattern "checkpoint-450000.pt" --dir .tmp/holdout/candidate
          test -s .tmp/holdout/base/checkpoint-400000.pt
          test -s .tmp/holdout/candidate/checkpoint-450000.pt
          sha256sum .tmp/holdout/base/checkpoint-400000.pt | tee .tmp/holdout/base/SHA256SUMS
          sha256sum .tmp/holdout/candidate/checkpoint-450000.pt | tee .tmp/holdout/candidate/SHA256SUMS

      - name: Verificar holdout fijo de 100 preguntas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("benchmarks/inference-holdout-v1.jsonl")
          rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          ids = [row["id"] for row in rows]
          assert len(rows) == 100, f"Expected 100 questions, got {len(rows)}"
          assert len(set(ids)) == 100, "Duplicate holdout IDs"
          assert all(row.get("split") == "inference_only" for row in rows)
          print(f"Fixed holdout OK: {len(rows)} unique inference-only questions")
          PY

      - name: Evaluar checkpoint padre 400k (referencia)
        run: |
          set -euo pipefail
          python scripts/minironin.py holdout \
            --checkpoint .tmp/holdout/base/checkpoint-400000.pt \
            --label "transformer-10m-400000-parent" --steps 400000 \
            --holdout benchmarks/inference-holdout-v1.jsonl \
            --output .tmp/holdout/base/diary-400000.json \
            --threads 2 --no-kv-cache

      - name: Evaluar candidato 450k con comparación pareada
        run: |
          set -euo pipefail
          python scripts/minironin.py holdout \
            --checkpoint .tmp/holdout/candidate/checkpoint-450000.pt \
            --label "transformer-10m-450000-candidate" --steps 450000 \
            --holdout benchmarks/inference-holdout-v1.jsonl \
            --base-diary .tmp/holdout/base/diary-400000.json \
            --output .tmp/holdout/candidate/diary-450000.json \
            --threads 2 --no-kv-cache

      - name: Resumir comparación sin puntuar automáticamente calidad
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path(".tmp/holdout/base/diary-400000.json").read_text(encoding="utf-8"))
          candidate = json.loads(Path(".tmp/holdout/candidate/diary-450000.json").read_text(encoding="utf-8"))
          assert base["holdout_sha256"] == candidate["holdout_sha256"]
          assert base["holdout_count"] == candidate["holdout_count"] == 100
          assert base["checkpoint_sha256"] != candidate["checkpoint_sha256"]
          summary = {
              "benchmark": "MINIRONIN inference holdout v1",
              "holdout_count": 100,
              "holdout_sha256": base["holdout_sha256"],
              "base": {
                  "label": base["label"],
                  "steps": base["completed_steps"],
                  "checkpoint_sha256": base["checkpoint_sha256"],
                  "generation": base["generation"],
              },
              "candidate": {
                  "label": candidate["label"],
                  "steps": candidate["completed_steps"],
                  "checkpoint_sha256": candidate["checkpoint_sha256"],
                  "generation": candidate["generation"],
                  "comparison_to_base": candidate["comparison_to_base"],
              },
              "scoring": "raw generations only; blind human review required",
          }
          Path(".tmp/holdout/comparison-400k-vs-450k.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Publicar ambos diarios y la comparación
        uses: actions/upload-artifact@v6
        with:
          name: minironin-holdout-paired-400k-vs-450k-100q
          path: .tmp/holdout/
          if-no-files-found: error
          retention-days: 90
