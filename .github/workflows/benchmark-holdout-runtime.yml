name: MINIRONIN — holdout real sin KV cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/benchmark-holdout-runtime.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release que contiene el checkpoint
        required: true
        type: string
        default: minironin-transformer-10m-step-400000-candidate
      checkpoint_file:
        description: Nombre exacto del asset del checkpoint
        required: true
        type: string
        default: checkpoint-400000.pt

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REPOSITORY: orbitalronin94/MINIRONIN
      RELEASE_TAG: ${{ github.event.inputs.release_tag || 'minironin-transformer-10m-step-400000-candidate' }}
      CHECKPOINT_FILE: ${{ github.event.inputs.checkpoint_file || 'checkpoint-400000.pt' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Descargar checkpoint 400k
        run: |
          set -euo pipefail
          mkdir -p .tmp/holdout
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern "$CHECKPOINT_FILE" --dir .tmp/holdout
          test -s ".tmp/holdout/$CHECKPOINT_FILE"
          sha256sum ".tmp/holdout/$CHECKPOINT_FILE" | tee .tmp/holdout/checkpoint.sha256
      - name: Ejecutar las 100 preguntas por referencia sin caché
        run: |
          python scripts/minironin.py holdout \
            --checkpoint ".tmp/holdout/$CHECKPOINT_FILE" \
            --label "checkpoint-400000-real-no-cache" --steps 400000 \
            --holdout benchmarks/inference-holdout-v1.jsonl \
            --output .tmp/holdout/diary.json --threads 2 --no-kv-cache
      - name: Publicar diario completo
        uses: actions/upload-artifact@v6
        with:
          name: minironin-holdout-checkpoint-400000-real
          path: .tmp/holdout/
          retention-days: 90
