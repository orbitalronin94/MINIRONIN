name: MINIRONIN — adquirir BNE Hemeroteca OCR español CC0 (lote 2)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/acquire-bne-hemeroteca-ocr-spanish-batch2.yml"
permissions:
  contents: write
  actions: write
concurrency:
  group: minironin-bne-ocr-spanish-batch2
  cancel-in-progress: false
env:
  RELEASE_TAG: bne-hemeroteca-ocr-es-v1
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - name: Read the exact source revision used by batch 1
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source-manifest
          for attempt in {1..30}; do
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir source-manifest --pattern "bne-ocr-es-ciencias.manifest.json"; then
              break
            fi
            sleep 20
          done
          test -s source-manifest/bne-ocr-es-ciencias.manifest.json
          revision="$(python -c 'import json;print(json.load(open("source-manifest/bne-ocr-es-ciencias.manifest.json"))["source_revision"])')"
          test "${#revision}" -eq 40
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
  convert-shards:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        split: [agricultura_y_ganaderia,deportes,fuerzas_armadas,mineria,musica,navegacion,relaciones_internacionales,religion,revistas_femeninas,teatro]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Parquet readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub==0.29.3" "pyarrow==19.0.1"
      - name: Curate one split shard at the same immutable revision
        env:
          SPLIT: ${{ matrix.split }}
          REVISION: ${{ needs.prepare-release.outputs.revision }}
        run: python scripts/acquire_bne_hemeroteca_ocr_spanish.py --split "$SPLIT" --revision "$REVISION" --output-dir out
      - name: Verify shard manifest and text digest
        env:
          SPLIT: ${{ matrix.split }}
        run: |
          python - <<'PY'
          import gzip,hashlib,json,os
          from pathlib import Path
          split=os.environ["SPLIT"]
          p=Path(f"out/bne-ocr-es-{split}.jsonl.gz")
          m=json.loads(Path(f"out/bne-ocr-es-{split}.manifest.json").read_text())
          h=hashlib.sha256();n=0
          with gzip.open(p,"rb") as f:
              for block in iter(lambda:f.read(1024*1024),b""):h.update(block)
          with gzip.open(p,"rt",encoding="utf-8") as f:
              for line in f:
                  r=json.loads(line)
                  assert r["language"]=="es" and r["license"].startswith("CC0")
                  assert r["train_eligible"] and (r["date"] is None or r["date"][:4]<="1900")
                  n+=1
          assert n==m["rows_admitted"] and h.hexdigest()==m["sha256_jsonl_uncompressed"]
          print(json.dumps({"split":split,"pages":n,"sha256":h.hexdigest()}))
          PY
      - name: Upload immutable text shard and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" out/bne-ocr-es-*.jsonl.gz out/bne-ocr-es-*.manifest.json --repo "$GITHUB_REPOSITORY" --clobber
  rebuild-unified-corpus:
    needs: convert-shards
    runs-on: ubuntu-latest
    steps:
      - name: Trigger unified training build after all BNE shards are published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/build-unified-train.yml/dispatches" -f ref=main
