name: MINIRONIN — admitir Minerva científico español
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  acquire-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned reader
        run: python -m pip install "huggingface_hub==0.29.3"
      - name: Resolve revision and acquire Spanish Minerva only
        run: |
          set -euo pipefail
          revision="$(git ls-remote https://huggingface.co/datasets/proxectonos/corpus_dominio_cientifico refs/heads/main | awk 'NR==1 {print $1}')"
          test "${#revision}" -eq 40
          python scripts/acquire_minerva_scientific_spanish.py --revision "$revision"
      - name: Verify output digest and admission count
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("data/curated/accepted")
          p=root/"minerva-scientific-es-train.jsonl"
          m=json.loads((root/"minerva-scientific-es-train.manifest.json").read_text())
          assert m["rows_admitted"]>0 and m["source_rows_scanned"]>=8000
          assert m["license"]=="CC BY 4.0"
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["sha256_jsonl"]
          print(json.dumps({k:m[k] for k in ("source_rows_scanned","rows_admitted","rows_skipped_no_explicit_open_license","rows_skipped_exact_duplicates")},ensure_ascii=False))
          PY
      - name: Publish full Spanish scientific corpus and manifest as persistent release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="minerva-scientific-es-v1"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Minerva — corpus científico español CC BY 4.0" --notes "Spanish scientific and academic corpus from Proxecto Nós. Corpus-level CC BY 4.0 declaration and institutional-agreement caveat retained in every record and manifest."
          fi
          gh release upload "$tag" data/curated/accepted/minerva-scientific-es-train.jsonl data/curated/accepted/minerva-scientific-es-train.manifest.json --repo "$GITHUB_REPOSITORY" --clobber
      - name: Rebuild unified training corpus after verified publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/build-unified-train.yml/dispatches" -f ref=main
