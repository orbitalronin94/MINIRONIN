name: MINIRONIN — iniciar Activar admisión BNE Hemeroteca OCR en 20 áreas
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kickoff-bne-ocr-spanish.yml"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: minironin-kickoff-bne-ocr-spanish-20-splits
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the pinned bulk acquisition workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/acquire-bne-hemeroteca-ocr-spanish.yml/dispatches" -f ref=main
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/acquire-bne-hemeroteca-ocr-spanish-batch2.yml/dispatches" -f ref=main
          echo "Dispatched acquire-bne-hemeroteca-ocr-spanish.yml; admitted rows and bytes will be read only from verified manifests."
