name: MINIRONIN auto-merge curated 1200-file PRs

on:
  workflow_run:
    workflows:
      - "MINIRONIN independent CI"
      - "MINIRONIN inherited-data audit"
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge-validated-curation:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge only exact 1200-file curated library PRs with both checks green
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail

          prs="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls")"
          pr_number="$(jq -r '.[0].number // empty' <<<"$prs")"
          if [[ -z "$pr_number" ]]; then
            echo "No open PR associated with this workflow SHA; nothing to merge."
            exit 0
          fi

          pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          state="$(jq -r '.state' <<<"$pr")"
          base="$(jq -r '.base.ref' <<<"$pr")"
          current_sha="$(jq -r '.head.sha' <<<"$pr")"
          merged="$(jq -r '.merged' <<<"$pr")"
          if [[ "$state" != "open" || "$base" != "main" || "$current_sha" != "$HEAD_SHA" || "$merged" == "true" ]]; then
            echo "PR state/base/head changed; refusing automatic merge."
            exit 0
          fi

          files="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/files" | jq -s 'add')"
          file_count="$(jq 'length' <<<"$files")"
          added_count="$(jq '[.[] | select(.status == "added")] | length' <<<"$files")"
          safe_paths="$(jq '[.[] | select(.status == "added" and (.filename | startswith("data/inherited/papers/curated/")))] | length' <<<"$files")"
          if [[ "$file_count" -ne 1200 || "$added_count" -ne 1200 || "$safe_paths" -ne 1200 ]]; then
            echo "Refusing merge: expected exactly 1200 newly added curated documents; got files=$file_count added=$added_count curated=$safe_paths."
            exit 0
          fi

          checks="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs")"
          if ! jq -e '
            [.check_runs[] | select(.name == "model-tests" or .name == "audit-papers")] as $required
            | ($required | map(.name) | unique | length == 2)
              and all($required[]; .status == "completed" and .conclusion == "success")
          ' <<<"$checks" >/dev/null; then
            echo "Required model-tests and audit-papers checks are not both successful yet."
            exit 0
          fi

          echo "All guards passed for PR #$pr_number; merging with squash."
          merge_result="$(gh api --method PUT "repos/$REPOSITORY/pulls/$pr_number/merge" -f merge_method=squash)"
          if [[ "$(jq -r '.merged' <<<"$merge_result")" != "true" ]]; then
            echo "GitHub did not confirm the merge; stopping."
            exit 1
          fi

          if [[ "$HEAD_BRANCH" == prep/wikisource-es-1200-batch-* ]]; then
            current_batch="$(sed 's/.*-batch-//' <<<"$HEAD_BRANCH")"
            next_batch=$((10#$current_batch + 1))
            if (( next_batch <= 31 )); then
              echo "Dispatching next deterministic 1200-document batch: $next_batch"
              gh api --method POST "repos/$REPOSITORY/actions/workflows/wikisource-es-1200-batch.yml/dispatches" -f ref=main -f "inputs[batch_index]=$next_batch"
            else
              echo "Reached configured 31-batch Wikisource intake ceiling."
              echo "Dispatching one unified-corpus build after all 37,200 texts have landed."
              gh api --method POST "repos/$REPOSITORY/actions/workflows/build-unified-train.yml/dispatches" -f ref=main
            fi
          fi
