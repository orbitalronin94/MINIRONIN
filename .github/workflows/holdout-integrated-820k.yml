name: MINIRONIN — holdout exclusivo checkpoint 820k (RAG integrado)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/holdout-integrated-820k.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: minironin-holdout-only-820k
  cancel-in-progress: false

jobs:
  holdout-820k:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: orbitalronin94/MINIRONIN
      PREPARATION_RUN_ID: "42682285328"
      CANDIDATE_TAG: minironin-full-corpus-150k-from-810k-step-820000
    steps:
      - name: Checkout MINIRONIN
        uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Descargar exclusivamente checkpoint 820k e informe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/holdout-820k/checkpoint .tmp/holdout-820k/integrated
          gh release download "$CANDIDATE_TAG" --repo "$REPOSITORY" --pattern "checkpoint-820000.pt" --dir .tmp/holdout-820k/checkpoint
          gh release download "$CANDIDATE_TAG" --repo "$REPOSITORY" --pattern "report-820000.json" --dir .tmp/holdout-820k/checkpoint
          gh release download "$CANDIDATE_TAG" --repo "$REPOSITORY" --pattern "SHA256SUMS-820000" --dir .tmp/holdout-820k/checkpoint
          expected="$(awk '$2 ~ /checkpoint-820000[.]pt$/ {print $1}' .tmp/holdout-820k/checkpoint/SHA256SUMS-820000)"
          test -n "$expected"
          echo "$expected  .tmp/holdout-820k/checkpoint/checkpoint-820000.pt" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".tmp/holdout-820k/checkpoint/report-820000.json").read_text(encoding="utf-8"))
          assert r.get("completed_steps")==820000, r.get("completed_steps")
          print(json.dumps({"step":r.get("completed_steps"),"validation_loss":r.get("validation_loss"),"validation_loss_by_domain":r.get("validation_loss_by_domain")},ensure_ascii=False))
          PY

      - name: Descargar RAG integrado exacto sin leer holdout
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/$REPOSITORY/actions/runs/$PREPARATION_RUN_ID")"
          [[ "$(jq -r .name <<<"$run")" == "Prepare MINIRONIN integrated evidence stack" ]]
          [[ "$(jq -r .status <<<"$run")" == "completed" && "$(jq -r .conclusion <<<"$run")" == "success" ]]
          gh run download "$PREPARATION_RUN_ID" --repo "$REPOSITORY" --name minironin-integrated-evidence-stack --dir .tmp/holdout-820k/integrated
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          root=Path(".tmp/holdout-820k/integrated")
          m=json.loads((root/"integrated-manifest.json").read_text())
          assert m["holdout_read"] is False and m["training_performed"] is False
          db=sqlite3.connect(root/"rag/minironin-rag.sqlite")
          rag=json.loads(db.execute("SELECT value FROM metadata WHERE key='manifest'").fetchone()[0])
          assert rag["holdout_read"] is False and rag["training_performed"] is False
          assert rag["chunks_unique"] > 0
          print(json.dumps({"admitted_documents":m["library"]["documents"],"rag_chunks":rag["chunks_unique"]},ensure_ascii=False))
          PY

      - name: Instalar PyTorch CPU y validar checkpoint y holdout fijo
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m py_compile scripts/run_inference_holdout.py scripts/rag_retrieve.py src/minironin/tokenizer.py
          python - <<'PY'
          import json,torch
          from pathlib import Path
          cp=torch.load(".tmp/holdout-820k/checkpoint/checkpoint-820000.pt",map_location="cpu",weights_only=False)
          assert cp.get("completed_steps")==820000
          assert cp.get("parameter_count")==9970176
          assert cp.get("active_vocabulary")==257
          assert cp.get("optimizer_state_dict"), "Optimizer state missing"
          print(json.dumps({"step":cp["completed_steps"],"parameters":cp["parameter_count"],"active_vocabulary":cp["active_vocabulary"],"tokenization":cp.get("tokenization","UTF-8 bytes + EOS")},ensure_ascii=False))
          rows=[json.loads(x) for x in Path("benchmarks/inference-holdout-v1.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(rows)==100 and len({x["id"] for x in rows})==100
          assert all(x.get("split")=="inference_only" for x in rows)
          print("100 preguntas inference-only verificadas.")
          PY

      - name: Ejecutar holdout de 820k con RAG integrado
        run: |
          python scripts/run_inference_holdout.py \
            --checkpoint .tmp/holdout-820k/checkpoint/checkpoint-820000.pt \
            --label "820k-byte-plus-integrated-rag" --steps 820000 \
            --holdout benchmarks/inference-holdout-v1.jsonl \
            --output .tmp/holdout-820k/diary-820k-rag.json \
            --rag-index .tmp/holdout-820k/integrated/rag/minironin-rag.sqlite \
            --rag-no-vectors --rag-top-k 5 --rag-max-context-chars 6000 \
            --max-new-tokens 128 --max-new-bytes 128 --threads 2

      - name: Publicar las 100 respuestas y diario auditable de 820k
        uses: actions/upload-artifact@v4
        with:
          name: minironin-holdout-only-820k-integrated-rag
          path: .tmp/holdout-820k/
          if-no-files-found: error
          retention-days: 90
