name: MINIRONIN — holdout pareado 500k vs 560k (100 preguntas)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/holdout-500k-vs-560k.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: orbitalronin94/MINIRONIN
      BASE_TAG: minironin-transformer-10m-step-500000-candidate
      CANDIDATE_TAG: minironin-cycle-1-step-560000
    steps:
      - name: Checkout MINIRONIN
        uses: actions/checkout@v4
      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Descargar checkpoints 500k y 560k
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/holdout/base .tmp/holdout/candidate
          gh release download "$BASE_TAG" --repo "$REPOSITORY" --pattern 'checkpoint-500000.pt' --dir .tmp/holdout/base
          gh release download "$CANDIDATE_TAG" --repo "$REPOSITORY" --pattern 'checkpoint-560000.pt' --dir .tmp/holdout/candidate
          test -s .tmp/holdout/base/checkpoint-500000.pt
          test -s .tmp/holdout/candidate/checkpoint-560000.pt
          sha256sum .tmp/holdout/base/checkpoint-500000.pt | tee .tmp/holdout/base/SHA256SUMS
          sha256sum .tmp/holdout/candidate/checkpoint-560000.pt | tee .tmp/holdout/candidate/SHA256SUMS
      - name: Validar holdout fijo y checkpoints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch
          path = Path('benchmarks/inference-holdout-v1.jsonl')
          rows = [json.loads(x) for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows) == 100, f'Expected 100 questions, got {len(rows)}'
          assert len({r['id'] for r in rows}) == 100, 'Duplicate IDs'
          for label, p, steps in [
              ('base', Path('.tmp/holdout/base/checkpoint-500000.pt'), 500000),
              ('candidate', Path('.tmp/holdout/candidate/checkpoint-560000.pt'), 560000),
          ]:
              ck = torch.load(p, map_location='cpu', weights_only=False)
              assert ck.get('completed_steps') == steps, (label, ck.get('completed_steps'))
              assert 'model_state_dict' in ck
              print(label, 'steps=', ck['completed_steps'], 'params=', ck.get('parameter_count'),
                    'active_vocab=', ck.get('active_vocabulary'))
          print('Holdout count:', len(rows))
          PY
      - name: Evaluar baseline 500k
        run: |
          python scripts/run_inference_holdout.py             --checkpoint .tmp/holdout/base/checkpoint-500000.pt             --label transformer-10m-500000-parent             --steps 500000             --holdout benchmarks/inference-holdout-v1.jsonl             --output .tmp/holdout/base/diary-500000.json             --threads 2 --no-kv-cache
      - name: Evaluar candidato 560k con los mismos 100 IDs
        run: |
          python scripts/run_inference_holdout.py             --checkpoint .tmp/holdout/candidate/checkpoint-560000.pt             --label minironin-cycle-1-step-560000             --steps 560000             --holdout benchmarks/inference-holdout-v1.jsonl             --base-diary .tmp/holdout/base/diary-500000.json             --output .tmp/holdout/candidate/diary-560000.json             --threads 2 --no-kv-cache
      - name: Construir comparación y validar integridad
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path('.tmp/holdout/base/diary-500000.json').read_text())
          cand = json.loads(Path('.tmp/holdout/candidate/diary-560000.json').read_text())
          assert base['holdout_count'] == cand['holdout_count'] == 100
          assert base['holdout_sha256'] == cand['holdout_sha256']
          assert [x['id'] for x in base['results']] == [x['id'] for x in cand['results']]
          out = {
              'benchmark': 'MINIRONIN inference holdout v1',
              'holdout_count': 100,
              'holdout_sha256': base['holdout_sha256'],
              'generation_config': base['generation'],
              'base': {'label': base['label'], 'steps': base['completed_steps'],
                       'checkpoint_sha256': base['checkpoint_sha256']},
              'candidate': {'label': cand['label'], 'steps': cand['completed_steps'],
                            'checkpoint_sha256': cand['checkpoint_sha256'],
                            'comparison_to_base': cand['comparison_to_base']},
              'scoring': 'Raw generations only; blind human review required. Changed answers are not a quality score.'
          }
          Path('.tmp/holdout/comparison-500k-vs-560k.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - name: Publicar respuestas completas y comparación
        uses: actions/upload-artifact@v6
        with:
          name: minironin-holdout-paired-500k-vs-560k-100q
          path: .tmp/holdout/
          if-no-files-found: error
          retention-days: 90
