name: Classics and semantic graph validation

on:
  pull_request:
    paths:
      - "data/classics/**"
      - "data/semantic/**"
      - "scripts/acquire_classics_library.py"
      - "scripts/build_semantic_library_graph.py"
      - "scripts/acquire_anarchist_library.py"
      - "tests/test_classics_library.py"
      - "tests/test_semantic_library_graph.py"
      - "tests/test_anarchist_library.py"
      - ".github/workflows/classics-validation.yml"
  push:
    branches: [main]
    paths:
      - "data/classics/**"
      - "data/semantic/**"
      - "scripts/acquire_classics_library.py"
      - "scripts/build_semantic_library_graph.py"
      - "scripts/acquire_anarchist_library.py"
      - "tests/test_classics_library.py"
      - "tests/test_semantic_library_graph.py"
      - "tests/test_anarchist_library.py"
      - ".github/workflows/classics-validation.yml"

permissions:
  contents: read

jobs:
  validate-classics-and-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile acquisition and graph scripts
        run: python -m py_compile scripts/acquire_classics_library.py scripts/acquire_anarchist_library.py scripts/build_semantic_library_graph.py
      - name: Run focused library tests
        run: python -m pytest -q tests/test_classics_library.py tests/test_semantic_library_graph.py tests/test_anarchist_library.py
