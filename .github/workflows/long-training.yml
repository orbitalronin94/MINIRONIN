name: MINIRONIN — 300k pasos desde checkpoint 130k (corpus textual completo)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/long-training.yml"
      - "scripts/train_long_run.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minironin-long-training-300k-from-130k
  cancel-in-progress: false

jobs:
  train-from-130k:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PARENT_RELEASE: long-train-step-130000
      PARENT_SHA256: 4eea4efe7e1c65da0ee7985ae3c09a7f69eab3cce90e2cabaa8694b6857cc986
      PARENT_STEP: "130000"
      TOTAL_STEPS: "430000"
    steps:
      - name: Checkout MINIRONIN
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar espacio
        run: |
          set -euo pipefail
          df -h .
          test "$(df --output=avail -k . | tail -1 | tr -d ' ')" -gt 8000000

      - name: Descargar y verificar checkpoint exacto de 130k
        run: |
          set -euo pipefail
          mkdir -p long-training
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/orbitalronin94/MINIRONIN/releases/download/$PARENT_RELEASE/checkpoint-130000.pt" \
            -o long-training/parent-130000.pt
          echo "$PARENT_SHA256  long-training/parent-130000.pt" | sha256sum -c -

      - name: Descargar y verificar corpus HERETIC completo
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/releases/assets"
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936363" -o heretic-corpus.part-0
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936357" -o heretic-corpus.part-1
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936364" -o parts.sha256
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936362" -o corpus.sha256
          test "$(stat -c%s heretic-corpus.part-0)" -eq 400000000
          test "$(stat -c%s heretic-corpus.part-1)" -eq 349837093
          sha256sum -c parts.sha256
          cat heretic-corpus.part-0 heretic-corpus.part-1 > heretic-approved-corpus.zip
          test "$(sha256sum heretic-approved-corpus.zip | awk '{print $1}')" = "$(awk '{print $1}' corpus.sha256)"
          unzip -tq heretic-approved-corpus.zip
          mkdir -p data/inherited/heretic-corpus
          unzip -q heretic-approved-corpus.zip -d data/inherited/heretic-corpus

      - name: Descargar y verificar PRODATPHIL v0.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/orbitalronin94/MINIRONIN/releases/download/reasoning-library-prodatphil-v0.3/prodatphil_en_txt_0_3.zip" \
            -o prodatphil_en_txt_0_3.zip
          echo "8eacf44101c87772a842fce3d3ab415903f28ba7684f8b33eddba0e2489c13c9  prodatphil_en_txt_0_3.zip" | sha256sum -c -
          mkdir -p data/inherited/prodatphil-en-v0.3
          unzip -tq prodatphil_en_txt_0_3.zip
          unzip -q prodatphil_en_txt_0_3.zip -d data/inherited/prodatphil-en-v0.3

      - name: Instalar PyTorch CPU y lector Parquet
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pyarrow
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Preflight del checkpoint y recuperar LR real
        id: parent
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, torch
          path = "long-training/parent-130000.pt"
          c = torch.load(path, map_location="cpu", weights_only=False)
          assert c.get("completed_steps") == 130000, c.get("completed_steps")
          assert c.get("parameter_count") == 9970176, c.get("parameter_count")
          assert c.get("active_vocabulary") == 257, c.get("active_vocabulary")
          assert "model_state_dict" in c and "optimizer_state_dict" in c
          groups = c["optimizer_state_dict"].get("param_groups", [])
          assert groups and "lr" in groups[0], "optimizer LR missing"
          lr = float(groups[0]["lr"])
          assert 0 < lr <= 3e-4, lr
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"parent_lr={lr:.12g}\\n")
          print({"parent_step": c["completed_steps"], "parameters": c["parameter_count"], "active_vocabulary": c["active_vocabulary"], "optimizer_lr": lr})
          PY

      - name: Entrenar 300.000 pasos adicionales; checkpoint cada 10k
        run: |
          set -euo pipefail
          input="long-training/parent-130000.pt"
          for start in $(seq 130000 10000 420000); do
            end=$((start + 10000))
            echo "::group::MINIRONIN global steps $((start + 1))-$end / $TOTAL_STEPS"
            python scripts/train_long_run.py \
              --heretic-root data/inherited/heretic-corpus \
              --books-root data/inherited/prodatphil-en-v0.3 \
              --input-checkpoint "$input" \
              --output-dir long-training/current \
              --start-step "$start" \
              --steps 10000 \
              --threads 2 \
              --dataset-cache "$RUNNER_TEMP/minironin-full-corpus-cache.pt" \
              --total-steps "$TOTAL_STEPS" \
              --schedule-start-step "$PARENT_STEP" \
              --schedule-start-lr "${{ steps.parent.outputs.parent_lr }}"
            printf -v padded "%06d" "$end"
            checkpoint="long-training/current/checkpoint-$padded.pt"
            report="long-training/current/report-$padded.json"
            test -s "$checkpoint"
            test -s "$report"
            cp "$checkpoint" "long-training/checkpoint-$end.pt"
            cp "$report" "long-training/report-$end.json"
            sha256sum "long-training/checkpoint-$end.pt" "long-training/report-$end.json" > "long-training/SHA256SUMS-$end"
            tag="long-train-130k-to-430k-step-$end"
            gh release create "$tag" \
              "long-training/checkpoint-$end.pt" \
              "long-training/report-$end.json" \
              "long-training/SHA256SUMS-$end" \
              --title "MINIRONIN 130k → $end / 430k" \
              --notes "300,000-step continuation from the verified 130,000-step checkpoint. Full recursive textual HERETIC corpus + full-text PRODATPHIL v0.3 + curated MINIRONIN behavior examples. 10k checkpoints, per-checkpoint validation, dataset manifest and SHA-256. Candidate only; no automatic promotion."
            input="long-training/checkpoint-$end.pt"
            echo "::endgroup::"
          done

      - name: Publicar artefacto completo de la ejecución
        uses: actions/upload-artifact@v6
        with:
          name: minironin-300k-from-130k-${{ github.run_id }}
          path: long-training/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
