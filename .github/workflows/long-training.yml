name: MINIRONIN — selección cíclica del mejor checkpoint + 300k

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/long-training.yml"
      - "scripts/train_long_run.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: minironin-best-checkpoint-300k-cycle
  cancel-in-progress: false

jobs:
  train-select-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      BOOTSTRAP_TAG: long-train-step-130000
      BOOTSTRAP_SHA256: 4eea4efe7e1c65da0ee7985ae3c09a7f69eab3cce90e2cabaa8694b6857cc986
      CYCLE_STEPS: "300000"
    steps:
      - name: Checkout MINIRONIN
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolver el mejor checkpoint de la generación anterior
        id: parent
        run: |
          set -euo pipefail
          gh api --paginate repos/orbitalronin94/MINIRONIN/releases > "$RUNNER_TEMP/releases.json"
          python - <<'PY'
          import json, os, re
          releases=json.load(open(os.environ["RUNNER_TEMP"]+"/releases.json"))
          found=[]
          for r in releases:
              m=re.fullmatch(r"minironin-cycle-(\\d+)-best",r.get("tag_name",""))
              if m and not r.get("draft") and not r.get("prerelease"):
                  found.append((int(m.group(1)),r["tag_name"]))
          if found:
              generation, tag=max(found)
              generation += 1
              kind="cycle-best"
          else:
              generation, tag, kind=1, os.environ["BOOTSTRAP_TAG"], "bootstrap-130k"
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"generation={generation}\nparent_tag={tag}\nparent_kind={kind}\n")
          print({"generation":generation,"parent_release":tag,"parent_kind":kind})
          PY

      - name: Comprobar espacio
        run: |
          set -euo pipefail
          df -h .
          test "$(df --output=avail -k . | tail -1 | tr -d ' ')" -gt 8000000

      - name: Descargar y verificar checkpoint y evaluación del padre
        run: |
          set -euo pipefail
          mkdir -p long-training/parent
          if [ "${{ steps.parent.outputs.parent_kind }}" = "bootstrap-130k" ]; then
            curl --fail --location --retry 4 --retry-all-errors \
              "https://github.com/orbitalronin94/MINIRONIN/releases/download/$BOOTSTRAP_TAG/checkpoint-130000.pt" \
              -o long-training/parent/parent-checkpoint.pt
            curl --fail --location --retry 4 --retry-all-errors \
              "https://github.com/orbitalronin94/MINIRONIN/releases/download/$BOOTSTRAP_TAG/report-130000.json" \
              -o long-training/parent/parent-report.json
            echo "$BOOTSTRAP_SHA256  long-training/parent/parent-checkpoint.pt" | sha256sum -c -
          else
            gh release download "${{ steps.parent.outputs.parent_tag }}" \
              --pattern best-checkpoint.pt --pattern best-report.json --pattern best-SHA256SUMS \
              --dir long-training/parent
            (cd long-training/parent && sha256sum -c best-SHA256SUMS)
            mv long-training/parent/best-checkpoint.pt long-training/parent/parent-checkpoint.pt
            mv long-training/parent/best-report.json long-training/parent/parent-report.json
          fi

      - name: Descargar y verificar HERETIC completo
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/releases/assets"
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936363" -o heretic-corpus.part-0
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936357" -o heretic-corpus.part-1
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936364" -o parts.sha256
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936362" -o corpus.sha256
          test "$(stat -c%s heretic-corpus.part-0)" -eq 400000000
          test "$(stat -c%s heretic-corpus.part-1)" -eq 349837093
          sha256sum -c parts.sha256
          cat heretic-corpus.part-0 heretic-corpus.part-1 > heretic-approved-corpus.zip
          test "$(sha256sum heretic-approved-corpus.zip | awk '{print $1}')" = "$(awk '{print $1}' corpus.sha256)"
          unzip -tq heretic-approved-corpus.zip
          mkdir -p data/inherited/heretic-corpus
          unzip -q heretic-approved-corpus.zip -d data/inherited/heretic-corpus

      - name: Descargar y verificar PRODATPHIL v0.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/orbitalronin94/MINIRONIN/releases/download/reasoning-library-prodatphil-v0.3/prodatphil_en_txt_0_3.zip" \
            -o prodatphil_en_txt_0_3.zip
          echo "8eacf44101c87772a842fce3d3ab415903f28ba7684f8b33eddba0e2489c13c9  prodatphil_en_txt_0_3.zip" | sha256sum -c -
          mkdir -p data/inherited/prodatphil-en-v0.3
          unzip -tq prodatphil_en_txt_0_3.zip
          unzip -q prodatphil_en_txt_0_3.zip -d data/inherited/prodatphil-en-v0.3

      - name: Instalar PyTorch CPU y lector Parquet
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pyarrow
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Validar padre y fijar parámetros de ciclo
        id: metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, torch
          cp=torch.load("long-training/parent/parent-checkpoint.pt",map_location="cpu",weights_only=False)
          report=json.load(open("long-training/parent/parent-report.json"))
          step=int(cp.get("completed_steps",-1))
          assert step > 0 and step % 10000 == 0, step
          assert report.get("completed_steps") == step, (report.get("completed_steps"),step)
          assert cp.get("parameter_count") == 9970176
          assert cp.get("active_vocabulary") == 257
          assert "model_state_dict" in cp and "optimizer_state_dict" in cp
          groups=cp["optimizer_state_dict"].get("param_groups",[])
          assert groups and 0 < float(groups[0]["lr"]) <= 3e-4
          total=step+300000
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"parent_step={step}\ntotal_steps={total}\nparent_lr={float(groups[0]['lr']):.12g}\n")
          print({"parent_step":step,"total_steps":total,"parameter_count":cp["parameter_count"],"optimizer_lr":groups[0]["lr"],"parent_validation_loss":report["validation_loss"]})
          PY

      - name: Entrenar 300k adicionales con todo el texto entrenable; checkpoint cada 10k
        run: |
          set -euo pipefail
          parent_step="${{ steps.metadata.outputs.parent_step }}"
          total_steps="${{ steps.metadata.outputs.total_steps }}"
          input="long-training/parent/parent-checkpoint.pt"
          seed_offset=$(( ${{ steps.parent.outputs.generation }} * 100000000 ))
          mkdir -p long-training/checkpoints
          cp long-training/parent/parent-report.json "long-training/report-$parent_step.json"
          cp "$input" "long-training/checkpoint-$parent_step.pt"
          for start in $(seq "$parent_step" 10000 "$((total_steps - 10000))"); do
            end=$((start + 10000))
            echo "::group::Generation ${{ steps.parent.outputs.generation }} — steps $((start + 1))-$end"
            python scripts/train_long_run.py \
              --heretic-root data/inherited/heretic-corpus \
              --books-root data/inherited/prodatphil-en-v0.3 \
              --input-checkpoint "$input" \
              --output-dir long-training/current \
              --start-step "$start" \
              --steps 10000 \
              --threads 2 \
              --dataset-cache "$RUNNER_TEMP/minironin-full-corpus-cache.pt" \
              --total-steps "$total_steps" \
              --schedule-start-step "$parent_step" \
              --schedule-start-lr "${{ steps.metadata.outputs.parent_lr }}" \
              --seed-offset "$seed_offset"
            printf -v padded "%06d" "$end"
            checkpoint="long-training/current/checkpoint-$padded.pt"
            report="long-training/current/report-$padded.json"
            test -s "$checkpoint" && test -s "$report"
            cp "$checkpoint" "long-training/checkpoint-$end.pt"
            cp "$report" "long-training/report-$end.json"
            sha256sum "long-training/checkpoint-$end.pt" "long-training/report-$end.json" > "long-training/SHA256SUMS-$end"
            gh release create "minironin-cycle-${{ steps.parent.outputs.generation }}-step-$end" \
              "long-training/checkpoint-$end.pt" "long-training/report-$end.json" "long-training/SHA256SUMS-$end" \
              --title "MINIRONIN cycle ${{ steps.parent.outputs.generation }} — step $end" \
              --notes "10k segment in a 300k continuation from the previous selected best checkpoint. Full recursively ingested eligible textual HERETIC + PRODATPHIL v0.3 + curated behavior set. Candidate only."
            input="long-training/checkpoint-$end.pt"
            echo "::endgroup::"
          done

      - name: Seleccionar el mejor checkpoint de todo el ciclo
        id: select
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path("long-training")
          rows=[]
          for rp in [root/f"report-${{ steps.metadata.outputs.parent_step }}.json", *sorted(root.glob("report-*.json"))]:
              report=json.loads(rp.read_text())
              step=int(report["completed_steps"])
              cp=root/f"checkpoint-{step}.pt"
              if cp.exists():
                  rows.append((float(report["validation_loss"]),step,cp,rp,report))
          if not rows:
              raise SystemExit("No verified checkpoint/report pairs found")
          loss,step,cp,rp,report=min(rows,key=lambda x:(x[0],x[1]))
          shutil.copy2(cp,root/"best-checkpoint.pt")
          shutil.copy2(rp,root/"best-report.json")
          summary={"generation":int("${{ steps.parent.outputs.generation }}"),"selected_step":step,"validation_loss":loss,"validation_loss_by_domain":report.get("validation_loss_by_domain"),"selected_source_report":rp.name,"selection_rule":"minimum fixed full-corpus validation loss among parent and all 30 checkpoints"}
          (root/"best-selection.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"best_step={step}\n")
          PY
          sha256sum long-training/best-checkpoint.pt long-training/best-report.json long-training/best-selection.json > long-training/best-SHA256SUMS
          gh release create "minironin-cycle-${{ steps.parent.outputs.generation }}-best" \
            long-training/best-checkpoint.pt long-training/best-report.json long-training/best-selection.json long-training/best-SHA256SUMS \
            --title "MINIRONIN cycle ${{ steps.parent.outputs.generation }} — selected best checkpoint" \
            --notes "Best checkpoint selected across the incoming parent and all 30 10k checkpoints using the same validation protocol. Candidate only; independent holdout required before promotion."

      - name: Publicar artefacto auditable del ciclo
        uses: actions/upload-artifact@v6
        with:
          name: minironin-cycle-${{ steps.parent.outputs.generation }}-300k-${{ github.run_id }}
          path: long-training/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Iniciar automáticamente el siguiente ciclo de 300k
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run long-training.yml --ref main
          echo "Dispatched next 300k cycle from the newly published best checkpoint."
