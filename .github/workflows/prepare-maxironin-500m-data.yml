name: MAXIRONIN 500M — preparar corpus BPE reutilizable

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-maxironin-500m-data.yml"
      - "scripts/prepare_maxironin_corpus.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: maxironin-500m-pretokenized-corpus
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de preparación
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tokenizers

      - name: Descargar corpus unificado aprobado
        uses: actions/download-artifact@v4
        with:
          name: minironin-unified-train-corpus-42523463620
          repository: orbitalronin94/MINIRONIN
          run-id: 42523463620
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: maxironin-corpus

      - name: Verificar corpus de origen
        run: |
          set -euo pipefail
          test -s maxironin-corpus/train.jsonl.gz
          (cd maxironin-corpus && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("maxironin-corpus/quality-report.json").read_text())
          assert report["record_count"] > 0, report
          print({"records":report["record_count"],"domains":len(report["domains"])})
          PY

      - name: Entrenar BPE y codificar el corpus una sola vez
        run: |
          set -euo pipefail
          python scripts/prepare_maxironin_corpus.py \
            --corpus maxironin-corpus/train.jsonl.gz \
            --output-dir maxironin-data

      - name: Crear manifiesto de integridad del paquete
        run: |
          set -euo pipefail
          cd maxironin-data
          sha256sum tokenizer.json train.bin validation.bin tokenizer-manifest.json > SHA256SUMS
          sha256sum -c SHA256SUMS
          du -h tokenizer.json train.bin validation.bin

      - name: Publicar paquete BPE + corpus codificado reutilizable
        uses: actions/upload-artifact@v4
        with:
          name: maxironin-500m-pretokenized-corpus-v1
          path: maxironin-data/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
