name: MINIRONIN — admisión BOE vigente batch6
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/acquire-boe-legislation-es-batch6.yml"]
permissions:
  contents: write
  actions: write
concurrency:
  group: minironin-boe-legislation-batch6
  cancel-in-progress: false
env:
  RELEASE_TAG: boe-legislation-es-v1
jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
  acquire:
    needs: check-release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [20,21,22,23]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "requests==2.32.3"
      - name: Acquire and curate current BOE law
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          offset=$((BATCH * 3000))
          python scripts/acquire_boe_legislation_es.py --offset "$offset" --limit 3000 --workers 2 --output-dir out
      - name: Verify provenance and output integrity
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          python - <<'PY'
          import gzip,hashlib,json,os
          from pathlib import Path
          b=int(os.environ["BATCH"]);o=b*3000
          p=Path(f"out/boe-legislation-es-{o:05d}.jsonl.gz")
          m=json.loads(Path(f"out/boe-legislation-es-{o:05d}.manifest.json").read_text())
          h=hashlib.sha256();n=0
          with gzip.open(p,"rb") as f:
              for x in iter(lambda:f.read(1048576),b""):h.update(x)
          with gzip.open(p,"rt",encoding="utf-8") as f:
              for line in f:
                  r=json.loads(line)
                  assert r["language"]=="es" and r["train_eligible"] and not r["synthetic"]
                  assert r["informative_only"] and "BOE" in r["license"]
                  assert r["source_url"].startswith("https://www.boe.es/")
                  n+=1
          assert n==m["records_admitted"] and h.hexdigest()==m["sha256_jsonl_uncompressed"]
          print(json.dumps({"batch":b,"catalogue":m["listing_records"],"admitted":n,"sha256":h.hexdigest()}))
          PY
      - name: Publish verified batch and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" out/boe-legislation-es-*.jsonl.gz out/boe-legislation-es-*.manifest.json --repo "$GITHUB_REPOSITORY" --clobber
  rebuild:
    needs: acquire
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/build-unified-train.yml/dispatches" -f ref=main
