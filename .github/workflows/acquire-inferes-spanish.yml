name: MINIRONIN — admitir InferES español para entrenamiento

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/acquire-inferes-spanish.yml"
      - "scripts/acquire_inferes_train.py"

permissions:
  contents: write

concurrency:
  group: minironin-acquire-inferes
  cancel-in-progress: false

jobs:
  acquire-and-admit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dataset readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets==3.3.2" "huggingface_hub==0.29.3"
      - name: Resolve immutable source revision and acquire train split only
        run: |
          set -euo pipefail
          revision="$(git ls-remote https://huggingface.co/datasets/venelin/inferes refs/heads/main | awk 'NR==1 {print $1}')"
          test "\${#revision}" -eq 40
          echo "INFERES_REVISION=$revision" >> "$GITHUB_ENV"
          python scripts/acquire_inferes_train.py --revision "$revision"
      - name: Audit accepted dataset, schema, labels and hash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("data/curated/accepted")
          data=root/"inferes-train.jsonl"
          manifest=json.loads((root/"inferes-train.manifest.json").read_text(encoding="utf-8"))
          digest=hashlib.sha256(data.read_bytes()).hexdigest()
          assert manifest["record_count"] >= 6000
          assert manifest["unique_source_ids"] == manifest["unique_examples"] == manifest["record_count"]
          assert manifest["license"] == "CC BY 4.0"
          assert manifest["source_split"] == "train" and manifest["excluded_splits"] == ["test"]
          assert digest == manifest["sha256_jsonl"]
          labels={"contradiction":0,"entailment":0,"neutral":0}
          seen=set()
          for line in data.read_text(encoding="utf-8").splitlines():
              row=json.loads(line)
              assert row["language"] == "es" and row["split"] == "train"
              assert row["train_eligible"] is True and row["admission_status"] == "accepted"
              assert row["synthetic"] is False and row["license"] == "CC BY 4.0"
              assert row["source_revision"] == manifest["source_revision"]
              assert row["id"] not in seen
              seen.add(row["id"])
              label=row["original_label"].casefold()
              if label in {"cnt","contradiction","contradictory"}: labels["contradiction"]+=1
              elif label in {"ent","entailment"}: labels["entailment"]+=1
              elif label in {"neutral","neu"}: labels["neutral"]+=1
              else: raise AssertionError(f"unknown label {label}")
          assert len(seen) == manifest["record_count"]
          print(json.dumps({"admitted_records":len(seen),"labels":labels,"sha256":digest,
                            "license":"CC BY 4.0","split":"train only"},ensure_ascii=False))
          PY
      - name: Commit accepted corpus and provenance manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curated/accepted/inferes-train.jsonl data/curated/accepted/inferes-train.manifest.json
          if git diff --cached --quiet; then
            echo "No source changes; accepted corpus already current."
            exit 0
          fi
          git commit -m "Admit Spanish InferES training corpus with CC BY 4.0 provenance"
          git push origin main
