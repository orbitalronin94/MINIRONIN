name: MINIRONIN RAG tests

on:
  push:
    branches: [feat/checkpoint-bridge]
    paths:
      - "scripts/build_rag_index.py"
      - "scripts/rag_retrieve.py"
      - "tests/test_rag_index.py"
      - "data/rag/**"
      - ".github/workflows/rag-tests.yml"
  pull_request:
    paths:
      - "scripts/build_rag_index.py"
      - "scripts/rag_retrieve.py"
      - "tests/test_rag_index.py"
      - "data/rag/**"

permissions:
  contents: read

jobs:
  rag-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_rag_index.py
