name: MINIRONIN RAG tests

on:
  push:
    branches: [feat/checkpoint-bridge]
    paths:
      - "scripts/build_rag_index.py"
      - "scripts/rag_retrieve.py"
      - "tests/test_rag_index.py"
      - "tests/test_eliza_corpus.py"
      - "scripts/build_eliza_corpus.py"
      - "scripts/continue_mamba_50m.py"
      - "scripts/run_mamba_rag_holdout.py"
      - ".github/workflows/mamba-rag-continuation.yml"
      - "data/rag/**"
      - ".github/workflows/rag-tests.yml"
  pull_request:
    paths:
      - "scripts/build_rag_index.py"
      - "scripts/rag_retrieve.py"
      - "tests/test_rag_index.py"
      - "tests/test_eliza_corpus.py"
      - "scripts/build_eliza_corpus.py"
      - "scripts/continue_mamba_50m.py"
      - "scripts/run_mamba_rag_holdout.py"
      - ".github/workflows/mamba-rag-continuation.yml"
      - "data/rag/**"

permissions:
  contents: read

jobs:
  rag-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install pytest
      - run: python -m py_compile scripts/continue_mamba_50m.py scripts/run_mamba_rag_holdout.py tests/test_mamba_rag_continuation.py
      - run: python -m pytest -q tests/test_rag_index.py tests/test_eliza_corpus.py tests/test_mamba_rag_continuation.py
