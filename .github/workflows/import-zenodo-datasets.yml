name: MINIRONIN — importar bibliotecas Zenodo CC BY
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/curated/zenodo-intake-manifests/**"
      - "scripts/import_zenodo_datasets.py"
      - ".github/workflows/import-zenodo-datasets.yml"
permissions:
  contents: write
  actions: write
concurrency:
  group: minironin-zenodo-intake
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned downloader
        run: python -m pip install "requests==2.32.3"
      - name: Import complete licensed Zenodo datasets
        run: python scripts/import_zenodo_datasets.py
      - name: Verify compressed output manifests and hashes
        run: |
          python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          root=Path("data/curated/accepted")
          for p in root.glob("*.manifest.json"):
              m=json.loads(p.read_text())
              if not m.get("record_id"): continue
              names=m.get("files",[m.get("file")])
              assert names and m["rows_admitted"]>0
              for name in names:
                  f=root/name
                  h=hashlib.sha256()
                  with f.open("rb") as raw:
                      for block in iter(lambda:raw.read(1024*1024),b""): h.update(block)
                  assert h.hexdigest() in {x["sha256"] for x in m.get("file_hashes",[])}
                  with gzip.open(f,"rt",encoding="utf-8") as stream:
                      for line in stream:
                          r=json.loads(line)
                          assert r["language"]=="es" and r["train_eligible"] and r["admission_status"]=="accepted"
                          assert r["license"]==m["license"]
          print("ZENODO_ACCEPTED_ARTIFACTS_VERIFIED")
          PY
      - name: Commit accepted data and dispatch unified corpus build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curated/accepted/ data/intake-reports/
          if git diff --cached --quiet; then echo "No new Zenodo data"; exit 0; fi
          git commit -m "Admit licensed Zenodo Spanish corpora"
          git push origin main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/build-unified-train.yml/dispatches" -f ref=main
