name: MINIRONIN — 150k continuation from 810k (non-synthetic admitted corpus)

on:
  workflow_run:
    workflows: ["MINIRONIN — construir corpus unificado de entrenamiento"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      corpus_run_id:
        description: "ID de una ejecución exitosa del constructor de corpus unificado"
        required: true
        default: "42679698690"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-150k-from-810k-nonsynthetic.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: minironin-legacy-vocab-150k-from-810k
  cancel-in-progress: false

jobs:
  train:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      CORPUS_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.corpus_run_id || (github.event_name == 'workflow_run' && github.event.workflow_run.id || '42679698690') }}
      PARENT_TAG: minironin-full-corpus-step-810000
      PARENT_SHA256: 2d8ff48dc0645d4b2d83c2462bc33b88a1abade9354eb9289c265c7a5b13ca6b
      START_STEP: "810000"
      TOTAL_STEPS: "960000"
    steps:
      - name: Checkout MINIRONIN
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar que el corpus procede de una ejecución exitosa en main
        run: |
          set -euo pipefail
          [[ "$CORPUS_RUN_ID" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$CORPUS_RUN_ID")"
          [[ "$(jq -r .name <<<"$run")" == "MINIRONIN — construir corpus unificado de entrenamiento" ]]
          [[ "$(jq -r .status <<<"$run")" == "completed" ]]
          [[ "$(jq -r .conclusion <<<"$run")" == "success" ]]
          [[ "$(jq -r .head_branch <<<"$run")" == "main" ]]
          echo "Corpus run confirmed: $CORPUS_RUN_ID"

      - name: Descargar el corpus unificado de la ejecución que acaba de finalizar
        uses: actions/download-artifact@v4
        with:
          name: minironin-unified-train-corpus-${{ env.CORPUS_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CORPUS_RUN_ID }}
          path: unified-train

      - name: Verificar integridad y presencia de bibliotecas no sintéticas
        run: |
          set -euo pipefail
          test -s unified-train/train.jsonl.gz
          test -s unified-train/sources.json
          test -s unified-train/quality-report.json
          test -s unified-train/SHA256SUMS
          (cd unified-train && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('unified-train/quality-report.json').read_text())
          sources=json.loads(Path('unified-train/sources.json').read_text())
          counts=report.get('synthetic_and_source_counts',{})
          source_rows=int(counts.get('source_text',0))
          synthetic_rows=int(counts.get('synthetic',0))
          assert int(report['record_count']) > 0
          assert source_rows > 0, 'No non-synthetic source records found'
          assert sources.get('record_count')==report['record_count']
          # This historical artifact predates build-time filtering. Its rows retain
          # explicit synthetic flags; train_long_run.py filters them at ingestion.
          print(json.dumps({'all_rows_in_artifact':report['record_count'],'source_rows':source_rows,'synthetic_rows_present_but_excluded_by_training_loader':synthetic_rows,'datasets':len(report.get('datasets',{})),'source_files':len(sources.get('sources',[]))},ensure_ascii=False,indent=2))
          PY
      - name: Comprobar espacio e instalar PyTorch CPU
        run: |
          set -euo pipefail
          df -h .
          test "$(df --output=avail -k . | tail -1 | tr -d ' ')" -gt 8000000
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Descargar y verificar checkpoint base de 810k (bytes UTF-8 + EOS)
        run: |
          set -euo pipefail
          mkdir -p train-150k/parent
          gh release download "$PARENT_TAG" --repo orbitalronin94/MINIRONIN --pattern "checkpoint-810000.pt" --dir train-150k/parent
          echo "$PARENT_SHA256  train-150k/parent/checkpoint-810000.pt" | sha256sum -c -
          python - <<'PY'
          import json, os, torch
          path="train-150k/parent/checkpoint-810000.pt"
          cp=torch.load(path,map_location="cpu",weights_only=False)
          assert cp.get("completed_steps")==810000, cp.get("completed_steps")
          assert cp.get("parameter_count")==9970176, cp.get("parameter_count")
          assert cp.get("active_vocabulary")==257, cp.get("active_vocabulary")
          assert "optimizer_state_dict" in cp
          tokenization=cp.get("tokenization","UTF-8 bytes + EOS")
          assert "byte" in tokenization.lower() or "utf-8" in tokenization.lower(), tokenization
          groups=cp["optimizer_state_dict"].get("param_groups",[])
          assert groups and 0<float(groups[0]["lr"])<=3e-4, groups
          lr=float(groups[0]["lr"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"parent_lr={lr:.12g}\n")
          print(json.dumps({"step":cp["completed_steps"],"parameters":cp["parameter_count"],
              "active_vocabulary":cp["active_vocabulary"],"tokenization":tokenization,"optimizer_lr":lr},indent=2))
          PY
        id: parent


      - name: Entrenar 150k pasos desde 810k; excluir datasets sintéticos
        run: |
          set -euo pipefail
          python -m py_compile scripts/train_long_run.py scripts/train_seed_tournament.py
          input="train-150k/parent/checkpoint-810000.pt"
          mkdir -p train-150k/checkpoints
          for start in $(seq 810000 10000 950000); do
            end=$((start + 10000))
            echo "::group::Legacy byte tokenizer / non-synthetic corpus — steps $((start + 1))-$end"
            python scripts/train_long_run.py \
              --unified-corpus unified-train/train.jsonl.gz \
              --exclude-synthetic --allow-sparse-domains \
              --input-checkpoint "$input" \
              --output-dir train-150k/current \
              --start-step "$start" \
              --steps 10000 \
              --batch-size 4 \
              --sequence-length 128 \
              --threads 2 \
              --dataset-cache "$RUNNER_TEMP/minironin-unified-corpus-cache.pt" \
              --total-steps 960000 \
              --schedule-start-step 810000 \
              --schedule-start-lr "${{ steps.parent.outputs.parent_lr }}"
            printf -v padded "%06d" "$end"
            checkpoint="train-150k/current/checkpoint-$padded.pt"
            report="train-150k/current/report-$padded.json"
            test -s "$checkpoint" && test -s "$report"
            cp "$checkpoint" "train-150k/checkpoints/checkpoint-$end.pt"
            cp "$report" "train-150k/checkpoints/report-$end.json"
            sha256sum "train-150k/checkpoints/checkpoint-$end.pt" "train-150k/checkpoints/report-$end.json" > "train-150k/checkpoints/SHA256SUMS-$end"
            gh release create "minironin-legacy-150k-from-810k-nonsynthetic-step-$end" \
              "train-150k/checkpoints/checkpoint-$end.pt" \
              "train-150k/checkpoints/report-$end.json" \
              "train-150k/checkpoints/SHA256SUMS-$end" \
              --title "MINIRONIN legacy tokenizer — step $end" \
              --notes "10k segment in the 150k continuation from verified 810k checkpoint. Active vocabulary 257 (UTF-8 bytes + EOS). Uses all admitted non-synthetic rows; records marked synthetic are excluded by the training loader. Candidate only; independent holdout required."
            input="$checkpoint"
            echo "::endgroup::"
          done

      - name: Verificar y publicar candidato de 960k
        run: |
          set -euo pipefail
          cp train-150k/current/checkpoint-960000.pt train-150k/checkpoint-960000.pt
          cp train-150k/current/report-960000.json train-150k/report-960000.json
          sha256sum train-150k/checkpoint-960000.pt train-150k/report-960000.json > train-150k/SHA256SUMS-960000
          python - <<'PY'
          import json, torch
          cp=torch.load("train-150k/checkpoint-960000.pt",map_location="cpu",weights_only=False)
          report=json.load(open("train-150k/report-960000.json"))
          assert cp["completed_steps"]==960000 and cp["active_vocabulary"]==257
          assert report["completed_steps"]==960000
          print(json.dumps({"completed_steps":cp["completed_steps"],"parameters":cp["parameter_count"],
              "active_vocabulary":cp["active_vocabulary"],"validation_loss":report["validation_loss"],
              "validation_by_domain":report["validation_loss_by_domain"],
              "corpus":report["dataset_manifest"]},ensure_ascii=False,indent=2))
          PY
          gh release create "minironin-legacy-150k-from-810k-nonsynthetic-step-960000-candidate" \
            train-150k/checkpoint-960000.pt train-150k/report-960000.json train-150k/SHA256SUMS-960000 \
            --title "MINIRONIN legacy tokenizer — 150k continuation / step 960000" \
            --notes "150,000 additional steps from the verified 810k byte-level checkpoint, trained on all admitted non-synthetic rows from the unified corpus. Synthetic datasets explicitly excluded. Candidate only; no automatic promotion. Matched holdout required."

      - name: Publicar informes y checkpoints intermedios como artefacto de auditoría
        uses: actions/upload-artifact@v4
        with:
          name: minironin-legacy-vocab-150k-from-810k-nonsynthetic-${{ github.run_id }}
          path: train-150k/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
