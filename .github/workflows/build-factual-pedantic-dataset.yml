name: Build factual-pedantic 500k dataset

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of unique sourced pairs (1–500000)"
        required: true
        default: "500000"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and validate sourced factual dataset
        run: |
          python scripts/build_factual_pedantic_dataset.py --count "${{ inputs.count }}" --output factual_pedantic.jsonl.gz
      - name: Upload dataset and manifest
        uses: actions/upload-artifact@v4
        with:
          name: factual-pedantic-${{ inputs.count }}-qa
          path: |
            factual_pedantic.jsonl.gz
            factual_pedantic.jsonl.gz.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
