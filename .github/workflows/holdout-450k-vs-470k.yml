name: MINIRONIN — holdout pareado 450k vs 470k (100 preguntas)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/holdout-450k-vs-470k.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: orbitalronin94/MINIRONIN
      BASE_TAG: minironin-transformer-10m-step-450000-candidate
      CANDIDATE_TAG: minironin-transformer-10m-step-470000-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Descargar y verificar checkpoints 450k y 470k
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/holdout/base .tmp/holdout/candidate
          gh release download "$BASE_TAG" --repo "$REPOSITORY" --pattern "checkpoint-450000.pt" --dir .tmp/holdout/base
          gh release download "$CANDIDATE_TAG" --repo "$REPOSITORY" --pattern "checkpoint-470000.pt" --dir .tmp/holdout/candidate
          test -s .tmp/holdout/base/checkpoint-450000.pt
          test -s .tmp/holdout/candidate/checkpoint-470000.pt
          base_sha="$(sha256sum .tmp/holdout/base/checkpoint-450000.pt | cut -d' ' -f1)"
          candidate_sha="$(sha256sum .tmp/holdout/candidate/checkpoint-470000.pt | cut -d' ' -f1)"
          test "$base_sha" = "9676a8d65c64405d24eb91a5728b06173d317706a8487624623a0956bb147441"
          test "$candidate_sha" = "f2dc0ed548db7565b080c9683e0e939ab2c424af394fc0286bce7168370d1c10"
          sha256sum .tmp/holdout/base/checkpoint-450000.pt | tee .tmp/holdout/base/SHA256SUMS
          sha256sum .tmp/holdout/candidate/checkpoint-470000.pt | tee .tmp/holdout/candidate/SHA256SUMS

      - name: Validar holdout fijo de 100 preguntas
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path("benchmarks/inference-holdout-v1.jsonl")
          raw = path.read_bytes()
          rows = [json.loads(line) for line in raw.decode("utf-8").splitlines() if line.strip()]
          ids = [row["id"] for row in rows]
          assert len(rows) == 100, f"Expected 100 questions, got {len(rows)}"
          assert len(set(ids)) == 100, "Duplicate holdout IDs"
          print(json.dumps({"count": len(rows), "unique_ids": len(set(ids)), "holdout_sha256": hashlib.sha256(raw).hexdigest()}))
          PY

      - name: Evaluar checkpoint padre 450k
        run: |
          set -euo pipefail
          python scripts/minironin.py holdout \
            --checkpoint .tmp/holdout/base/checkpoint-450000.pt \
            --label "transformer-10m-450000-parent" --steps 450000 \
            --holdout benchmarks/inference-holdout-v1.jsonl \
            --output .tmp/holdout/base/diary-450000.json \
            --threads 2 --no-kv-cache

      - name: Evaluar candidato 470k con los mismos 100 IDs
        run: |
          set -euo pipefail
          python scripts/minironin.py holdout \
            --checkpoint .tmp/holdout/candidate/checkpoint-470000.pt \
            --label "transformer-10m-470000-candidate" --steps 470000 \
            --holdout benchmarks/inference-holdout-v1.jsonl \
            --base-diary .tmp/holdout/base/diary-450000.json \
            --output .tmp/holdout/candidate/diary-470000.json \
            --threads 2 --no-kv-cache

      - name: Construir comparación pareada y validar integridad
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path(".tmp/holdout/base/diary-450000.json").read_text(encoding="utf-8"))
          candidate = json.loads(Path(".tmp/holdout/candidate/diary-470000.json").read_text(encoding="utf-8"))
          assert base["holdout_count"] == candidate["holdout_count"] == 100
          assert base["holdout_sha256"] == candidate["holdout_sha256"]
          assert base["checkpoint_sha256"] != candidate["checkpoint_sha256"]
          assert [r["id"] for r in base["results"]] == [r["id"] for r in candidate["results"]]
          summary = {
              "benchmark": "MINIRONIN inference holdout v1",
              "holdout_count": 100,
              "holdout_sha256": base["holdout_sha256"],
              "generation_config": base["generation"],
              "base": {
                  "label": base["label"], "steps": base["completed_steps"],
                  "checkpoint_sha256": base["checkpoint_sha256"],
              },
              "candidate": {
                  "label": candidate["label"], "steps": candidate["completed_steps"],
                  "checkpoint_sha256": candidate["checkpoint_sha256"],
                  "comparison_to_base": candidate["comparison_to_base"],
              },
              "scoring": "Raw generations only; blind human review required. Changed answers are not a quality score.",
          }
          Path(".tmp/holdout/comparison-450k-vs-470k.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Publicar diarios y comparación
        uses: actions/upload-artifact@v6
        with:
          name: minironin-holdout-paired-450k-vs-470k-100q
          path: .tmp/holdout/
          if-no-files-found: error
          retention-days: 90
