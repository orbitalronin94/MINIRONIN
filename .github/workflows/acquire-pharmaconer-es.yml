name: MINIRONIN — admitir PharmaCoNER español completo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/acquire-pharmaconer-es.yml"
      - "scripts/acquire_pharmaconer_es.py"
permissions:
  contents: write
  actions: write
concurrency:
  group: minironin-pharmaconer-es-intake
  cancel-in-progress: false
jobs:
  acquire-and-admit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Hugging Face reader
        run: python -m pip install "huggingface_hub==0.29.3"
      - name: Import the complete expert-annotated train split
        run: python scripts/acquire_pharmaconer_es.py
      - name: Verify cardinality, BIO labels, provenance and hash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("data/curated/accepted")
          p=root/"pharmaconer-es-train.jsonl"
          m=json.loads((root/"pharmaconer-es-train.manifest.json").read_text())
          assert m["rows_admitted"] >= 7000 and m["source_clinical_cases"] == 500
          assert m["license"] == "CC BY 4.0" and m["source_split"] == "train"
          assert hashlib.sha256(p.read_bytes()).hexdigest() == m["sha256_jsonl"]
          seen=set(); tags=set()
          for line in p.read_text(encoding="utf-8").splitlines():
              r=json.loads(line)
              assert r["language"]=="es" and r["train_eligible"] and r["admission_status"]=="accepted"
              assert r["license"]=="CC BY 4.0" and r["source_revision"] and r["text"]
              assert r["split"]=="train" and r["id"] not in seen
              seen.add(r["id"])
              tags.update(a["tag"] for a in r["ner_annotations"])
          assert len(seen)==m["rows_admitted"]
          assert tags <= {"B-NO_NORMALIZABLES","B-NORMALIZABLES","B-PROTEINAS","B-UNCLEAR","I-NO_NORMALIZABLES","I-NORMALIZABLES","I-PROTEINAS","I-UNCLEAR"}
          print(json.dumps({"admitted_sentences":len(seen),"bio_tags":sorted(tags),"license":m["license"],"sha256":m["sha256_jsonl"]},ensure_ascii=False))
          PY
      - name: Commit the full accepted training split
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curated/accepted/pharmaconer-es-train.jsonl data/curated/accepted/pharmaconer-es-train.manifest.json
          git commit -m "Admit complete Spanish PharmaCoNER training split"
          git push origin main
          GH_TOKEN="${{ github.token }}" gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/build-unified-train.yml/dispatches" -f ref=main
