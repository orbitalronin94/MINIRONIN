name: MINIRONIN — Mamba 50M inference holdout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mamba-inference-holdout.yml"
      - "scripts/run_mamba_inference_holdout.py"
      - "benchmarks/inference-holdout-v1.jsonl"

permissions:
  contents: write
  actions: read

concurrency:
  group: minironin-mamba-inference-holdout
  cancel-in-progress: true

jobs:
  evaluate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout versioned 100-question holdout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download the exact completed Mamba candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/orbitalronin94/MINIRONIN/actions/artifacts/13612073861/zip" \
            -o mamba-candidate.zip
          echo "b0ce2ba81cf449d3b2e9edcbffd4982910270110b0b167c7c70a747cc3dc0e75  mamba-candidate.zip" | sha256sum -c -
          unzip -q mamba-candidate.zip -d candidate
          checkpoint="$(find candidate -type f -name 'mamba-checkpoint-1000.pt' -print -quit)"
          test -n "$checkpoint"
          mkdir -p .tmp/mamba
          cp "$checkpoint" .tmp/mamba/mamba-checkpoint-1000.pt
          echo "CHECKPOINT_PATH=.tmp/mamba/mamba-checkpoint-1000.pt" >> "$GITHUB_ENV"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Run the fixed 100-question holdout
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_mamba_inference_holdout.py src/minironin/mamba.py
          python scripts/run_mamba_inference_holdout.py \
            --checkpoint "$CHECKPOINT_PATH" \
            --holdout benchmarks/inference-holdout-v1.jsonl \
            --output benchmarks/diary/mamba-50m-1000.json \
            --max-new-tokens 128 \
            --threads 2

      - name: Upload complete raw answers and comparison diary
        uses: actions/upload-artifact@v6
        with:
          name: minironin-mamba-50m-holdout-100
          path: benchmarks/diary/mamba-50m-1000.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit auditable holdout diary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/diary/mamba-50m-1000.json
          git commit -m "Record Mamba 50M inference holdout results"
          git pull --rebase origin main
          git push origin HEAD:main
