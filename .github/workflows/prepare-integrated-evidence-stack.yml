name: Prepare MINIRONIN integrated evidence stack

on:
  workflow_dispatch:
    inputs:
      embeddings:
        description: Build multilingual E5 vectors as well as the BM25 index
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: minironin-integrated-evidence-stack
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Checkout admitted RONIN-IA library manifests and payloads
        uses: actions/checkout@v5
        with:
          repository: orbitalronin94/RONIN-IA
          ref: main
          path: external/roninia
          fetch-depth: 1

      - name: Checkout authored Papers library
        uses: actions/checkout@v5
        with:
          repository: orbitalronin94/Papers
          ref: main
          path: external/papers
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install index and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ "${{ inputs.embeddings }}" = "true" ]; then
            python -m pip install -r requirements-rag.txt
          fi

      - name: Download source-pinned admitted corpus artifacts when payloads are not committed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/download_admitted_artifacts.py \
            --roninia-root external/roninia \
            --output artifacts/library/downloads

      - name: Import only scoped-admitted train payloads and authored libraries
        run: |
          mkdir -p artifacts/library
          python scripts/import_admitted_sources.py \
            --roninia-root external/roninia \
            --papers-root external/papers \
            --minironin-root . \
            --output artifacts/library/admissions.jsonl

      - name: Validate rights, exact payload hashes and document inventory
        run: |
          python scripts/build_library_manifest.py \
            --root . \
            --admissions artifacts/library/admissions.jsonl \
            --output artifacts/library/canonical \
            --max-file-mb 512
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("artifacts/library/canonical/manifest.json").read_text())
          assert m["documents"] > 0, "No admitted documents materialized"
          assert m["holdout_read"] is False
          assert m["train_eligible"] > 0
          assert m["retrieval_eligible"] > 0
          print(json.dumps(m, ensure_ascii=False, indent=2))
          PY

      - name: Build evidence-conditioned awake rows
        run: |
          python scripts/build_awake_rows.py \
            --documents artifacts/library/canonical/documents.jsonl \
            --train-output artifacts/awake-rows/train.jsonl \
            --validation-output artifacts/awake-rows/validation.jsonl

      - name: Build BACKDOOR_BPE from train documents only
        run: |
          python scripts/build_backdoor_bpe.py \
            --train-jsonl artifacts/library/canonical/documents.jsonl \
            --output artifacts/tokenizer/backdoor-bpe.json \
            --max-tokens 256 \
            --min-frequency 8 \
            --min-documents 3
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("artifacts/tokenizer/backdoor-bpe.json")
          m = json.loads(p.read_text())
          assert m["eos_id"] == 256
          assert m["base_active_vocab"] == 257
          assert 257 <= m["active_vocab"] <= 23000
          print(json.dumps({k: m[k] for k in ("tokenizer_name", "active_vocab", "selection")}, ensure_ascii=False))
          PY

      - name: Build literal hybrid RAG index
        env:
          BUILD_EMBEDDINGS: ${{ inputs.embeddings }}
        run: |
          args=(--documents artifacts/library/canonical/documents.jsonl --output artifacts/rag/minironin-rag.sqlite)
          if [ "$BUILD_EMBEDDINGS" != "true" ]; then args+=(--no-embeddings); fi
          python scripts/build_rag_index.py "${args[@]}"

      - name: Run deterministic unit and integration tests
        run: |
          python -m py_compile \
            src/minironin/tokenizer.py \
            scripts/build_library_manifest.py \
            scripts/import_admitted_sources.py \
            scripts/download_admitted_artifacts.py \
            scripts/build_awake_rows.py \
            scripts/build_backdoor_bpe.py \
            scripts/build_rag_index.py \
            scripts/train_backdoor_bpe_continuation.py \
            scripts/run_inference_holdout.py
          pytest -q tests/test_tokenizer.py tests/test_library_manifest.py

      - name: Verify integrated artifact contracts
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sqlite3
          root = pathlib.Path("artifacts")
          library = json.loads((root / "library/canonical/manifest.json").read_text())
          tokenizer = json.loads((root / "tokenizer/backdoor-bpe.json").read_text())
          db = sqlite3.connect(root / "rag/minironin-rag.sqlite")
          rag = json.loads(db.execute("SELECT value FROM metadata WHERE key='manifest'").fetchone()[0])
          chunks = db.execute("SELECT count(*) FROM chunks").fetchone()[0]
          assert library["holdout_read"] is False
          assert rag["holdout_read"] is False and rag["training_performed"] is False
          assert chunks == rag["chunks_unique"] and chunks > 0
          assert tokenizer["eos_id"] == 256
          assert tokenizer["base_active_vocab"] == 257
          for rel in ("awake-rows/train.jsonl", "awake-rows/validation.jsonl"):
              assert (root / rel).is_file()
          manifest = {
              "schema": "minironin-integrated-evidence-stack-v1",
              "library": library,
              "rag": rag,
              "tokenizer": {
                  "active_vocab": tokenizer["active_vocab"],
                  "eos_id": tokenizer["eos_id"],
                  "sha256": hashlib.sha256((root / "tokenizer/backdoor-bpe.json").read_bytes()).hexdigest(),
              },
              "awake_rows": {
                  "train": sum(1 for _ in (root / "awake-rows/train.jsonl").open()),
                  "validation": sum(1 for _ in (root / "awake-rows/validation.jsonl").open()),
              },
              "holdout_read": False,
              "training_performed": False,
          }
          (root / "integrated-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: minironin-integrated-evidence-stack
          path: artifacts/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
