name: MINIRONIN — ampliar admisión de legislación BOE vigente (lotes 4–7)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/acquire-boe-legislation-es-batch2.yml"
permissions:
  contents: write
  actions: write
concurrency:
  group: minironin-boe-legislation-batch2
  cancel-in-progress: false
env:
  RELEASE_TAG: boe-legislation-es-v1
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify existing BOE release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
  acquire-batches:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned HTTP client
        run: python -m pip install "requests==2.32.3"
      - name: Download, filter current BOE law and convert to training JSONL
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          offset=$((BATCH * 3000))
          python scripts/acquire_boe_legislation_es.py --offset "$offset" --limit 3000 --workers 2 --output-dir out
      - name: Verify BOE attribution, informative-only label and digest
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          python - <<'PY'
          import gzip,hashlib,json,os
          from pathlib import Path
          offset=int(os.environ["BATCH"])*3000
          p=Path(f"out/boe-legislation-es-{offset:05d}.jsonl.gz")
          m=json.loads(Path(f"out/boe-legislation-es-{offset:05d}.manifest.json").read_text())
          h=hashlib.sha256();count=0
          with gzip.open(p,"rb") as f:
              for block in iter(lambda:f.read(1024*1024),b""):h.update(block)
          with gzip.open(p,"rt",encoding="utf-8") as f:
              for line in f:
                  r=json.loads(line)
                  assert r["language"]=="es" and r["train_eligible"]
                  assert r["synthetic"] is False and r["informative_only"] is True
                  assert "BOE" in r["license"] and r["attribution"].startswith("Basado en datos de la Agencia Estatal")
                  assert r["source_url"].startswith("https://www.boe.es/")
                  count+=1
          assert count==m["records_admitted"] and h.hexdigest()==m["sha256_jsonl_uncompressed"]
          print(json.dumps({"batch":int(os.environ["BATCH"]),"offset":offset,"records":count,"laws":m["laws_with_current_text"],"sha256":h.hexdigest()}))
          PY
      - name: Upload immutable BOE batch and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" out/boe-legislation-es-*.jsonl.gz out/boe-legislation-es-*.manifest.json --repo "$GITHUB_REPOSITORY" --clobber
  rebuild-unified-corpus:
    needs: acquire-batches
    runs-on: ubuntu-latest
    steps:
      - name: Trigger unified corpus build after BOE batches are published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/build-unified-train.yml/dispatches" -f ref=main
