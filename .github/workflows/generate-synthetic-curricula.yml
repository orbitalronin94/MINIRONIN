name: Generate MINIRONIN synthetic curricula 24x50k

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_synthetic_curricula.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate and audit 1.2 million examples
        run: python scripts/generate_synthetic_curricula.py --output-dir generated-curricula --seed 20261108
      - name: Upload all 24 datasets and manifests
        uses: actions/upload-artifact@v4
        with:
          name: minironin-synthetic-curricula-24x50k
          path: generated-curricula/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
