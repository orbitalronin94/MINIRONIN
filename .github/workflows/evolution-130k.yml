name: MINIRONIN — evolución 130k: 30 semillas x 1k + ganador 200k
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evolution-130k.yml"
      - "scripts/train_130k_evolution.py"
      - "scripts/train_long_run.py"
permissions:
  contents: write
concurrency:
  group: minironin-evolution-130k
  cancel-in-progress: false
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check disk
        run: |
          set -euo pipefail
          df -h .
          test "$(df --output=avail -k . | tail -1 | tr -d ' ')" -gt 8000000
      - name: Download exact 130k parent and verify
        run: |
          set -euo pipefail
          mkdir -p evolution-tournament
          curl --fail --location --retry 4 --retry-all-errors "https://github.com/orbitalronin94/MINIRONIN/releases/download/long-train-step-130000/checkpoint-130000.pt" -o evolution-tournament/parent-130000.pt
          echo "4eea4efe7e1c65da0ee7985ae3c09a7f69eab3cce90e2cabaa8694b6857cc986  evolution-tournament/parent-130000.pt" | sha256sum -c -
      - name: Download and verify full HERETIC corpus
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/releases/assets"
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936363" -o heretic-corpus.part-0
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936357" -o heretic-corpus.part-1
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936364" -o parts.sha256
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936362" -o corpus.sha256
          test "$(stat -c%s heretic-corpus.part-0)" -eq 400000000
          test "$(stat -c%s heretic-corpus.part-1)" -eq 349837093
          sha256sum -c parts.sha256
          cat heretic-corpus.part-0 heretic-corpus.part-1 > heretic-approved-corpus.zip
          test "$(sha256sum heretic-approved-corpus.zip | awk '{print $1}')" = "$(awk '{print $1}' corpus.sha256)"
          unzip -tq heretic-approved-corpus.zip
          mkdir -p data/inherited/heretic-corpus
          unzip -q heretic-approved-corpus.zip -d data/inherited/heretic-corpus
      - name: Download PRODATPHIL v0.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors "https://github.com/orbitalronin94/MINIRONIN/releases/download/reasoning-library-prodatphil-v0.3/prodatphil_en_txt_0_3.zip" -o prodatphil_en_txt_0_3.zip
          echo "8eacf44101c87772a842fce3d3ab415903f28ba7684f8b33eddba0e2489c13c9  prodatphil_en_txt_0_3.zip" | sha256sum -c -
          mkdir -p data/inherited/prodatphil-en-v0.3
          unzip -tq prodatphil_en_txt_0_3.zip
          unzip -q prodatphil_en_txt_0_3.zip -d data/inherited/prodatphil-en-v0.3
      - name: Install CPU PyTorch and corpus reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pyarrow
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run 30 descendants from identical 130k parent
        run: |
          set -euo pipefail
          python scripts/train_130k_evolution.py --parent evolution-tournament/parent-130000.pt --heretic-root data/inherited/heretic-corpus --books-root data/inherited/prodatphil-en-v0.3 --cache "$RUNNER_TEMP/minironin-full-corpus-cache.pt" --out evolution-tournament --seeds 30 --steps 1000 --threads 2
          sha256sum -c evolution-tournament/SHA256SUMS
      - name: Publish tournament winner and ranking
        run: |
          set -euo pipefail
          gh release create "evolution-130k-${GITHUB_RUN_ID}" evolution-tournament/winner-131000.pt evolution-tournament/tournament-report.json evolution-tournament/SHA256SUMS --title "MINIRONIN 130k evolutionary tournament ${GITHUB_RUN_ID}" --notes "30 descendants from the exact 130k parent, 1,000 optimizer steps each. Candidate winner selected by common document-disjoint validation. No main promotion."
      - name: Continue winner for 200,000 additional steps
        run: |
          set -euo pipefail
          input="evolution-tournament/winner-131000.pt"
          for start in $(seq 131000 10000 321000); do
            end=$((start + 10000))
            python scripts/train_long_run.py --heretic-root data/inherited/heretic-corpus --books-root data/inherited/prodatphil-en-v0.3 --input-checkpoint "$input" --output-dir evolution-tournament/continuation --start-step "$start" --steps 10000 --threads 2 --dataset-cache "$RUNNER_TEMP/minironin-full-corpus-cache.pt" --total-steps 331000 --schedule-start-step 131000
            cp "evolution-tournament/continuation/checkpoint-$end.pt" "evolution-tournament/checkpoint-$end.pt"
            cp "evolution-tournament/continuation/report-$end.json" "evolution-tournament/report-$end.json"
            sha256sum "evolution-tournament/checkpoint-$end.pt" "evolution-tournament/report-$end.json" > "evolution-tournament/SHA256SUMS-$end"
            gh release create "evolution-130k-step-$end" "evolution-tournament/checkpoint-$end.pt" "evolution-tournament/report-$end.json" "evolution-tournament/SHA256SUMS-$end" --title "MINIRONIN evolutionary winner step $end" --notes "Continuation of 30x1000 tournament winner from step 131000; candidate only. Holdout review required."
            input="evolution-tournament/checkpoint-$end.pt"
          done
      - name: Select best checkpoint across the complete 200k continuation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path("evolution-tournament")
          candidates = [(root / "winner-131000.pt", root / "tournament-report.json")]
          for report in sorted(root.glob("report-*.json")):
              step = int(report.stem.split("-")[-1])
              candidates.append((root / f"checkpoint-{step}.pt", report))
          rows = []
          for checkpoint, report_path in candidates:
              report = json.loads(report_path.read_text())
              rows.append((float(report.get("winner_validation_loss", report.get("validation_loss"))),
                           checkpoint, report_path, report))
          loss, checkpoint, report_path, report = min(rows, key=lambda row: row[0])
          shutil.copy2(checkpoint, root / "selected-best-checkpoint.pt")
          selected = {"selected_checkpoint": checkpoint.name, "completed_steps": report.get("completed_steps", 131000),
                      "validation_loss": loss, "validation_loss_by_domain": report.get("validation_loss_by_domain", report.get("winner_by_domain")),
                      "selection_rule": "lowest fixed validation loss across tournament winner and all 20 continuation checkpoints",
                      "source_report": report_path.name}
          (root / "selected-best-report.json").write_text(json.dumps(selected, indent=2) + "\\n")
          print(json.dumps(selected))
          PY
          sha256sum evolution-tournament/selected-best-checkpoint.pt evolution-tournament/selected-best-report.json > evolution-tournament/selected-best-SHA256SUMS
          gh release create "evolution-130k-best-${GITHUB_RUN_ID}" evolution-tournament/selected-best-checkpoint.pt evolution-tournament/selected-best-report.json evolution-tournament/selected-best-SHA256SUMS --title "MINIRONIN selected best checkpoint ${GITHUB_RUN_ID}" --notes "Best validation checkpoint across the tournament winner and all 20 continuation checkpoints. Candidate only; independent holdout review required."
      - name: Publish full run artifact
        uses: actions/upload-artifact@v6
        with:
          name: minironin-evolution-130k-${{ github.run_id }}
          path: evolution-tournament/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
