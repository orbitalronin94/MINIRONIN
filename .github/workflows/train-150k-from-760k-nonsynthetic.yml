name: MINIRONIN — 150k continuation from verified 760k (legacy byte tokenizer)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preflight comprueba checkpoint/corpus; train inicia la continuación de 150k"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - train
      corpus_run_id:
        description: "ID de una ejecución exitosa del constructor de corpus unificado"
        required: true
        default: "42523463620"
        type: string
  pull_request:
    paths:
      - ".github/workflows/train-150k-from-760k-nonsynthetic.yml"
      - "scripts/train_long_run.py"
      - "scripts/train_seed_tournament.py"

permissions:
  actions: read
  contents: write

concurrency:
  group: minironin-legacy-vocab-150k-from-760k
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validar sintaxis Python antes del merge
        run: python -m py_compile scripts/train_long_run.py scripts/train_seed_tournament.py

  train:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      CORPUS_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.corpus_run_id || '42523463620' }}
      PARENT_TAG: minironin-legacy-150k-from-650k-step-760000
      PARENT_SHA256: e9f6e0174bada1a301738685737aad2025c3ae80cd7bb5179d4cb37d9add5322
      START_STEP: "760000"
      TOTAL_STEPS: "910000"
    steps:
      - name: Checkout MINIRONIN
        uses: actions/checkout@v6

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validar que el corpus procede de una ejecución exitosa en main
        run: |
          set -euo pipefail
          [[ "$CORPUS_RUN_ID" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$CORPUS_RUN_ID")"
          [[ "$(jq -r .name <<<"$run")" == "MINIRONIN — construir corpus unificado de entrenamiento" ]]
          [[ "$(jq -r .status <<<"$run")" == "completed" ]]
          [[ "$(jq -r .conclusion <<<"$run")" == "success" ]]
          [[ "$(jq -r .head_branch <<<"$run")" == "main" ]]
          echo "Corpus run confirmed: $CORPUS_RUN_ID"

      - name: Descargar el corpus unificado de la ejecución indicada
        uses: actions/download-artifact@v8
        with:
          name: minironin-unified-train-corpus-${{ env.CORPUS_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CORPUS_RUN_ID }}
          path: unified-train

      - name: Verificar integridad y presencia de bibliotecas no sintéticas
        run: |
          set -euo pipefail
          test -s unified-train/train.jsonl.gz
          test -s unified-train/sources.json
          test -s unified-train/quality-report.json
          test -s unified-train/SHA256SUMS
          (cd unified-train && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('unified-train/quality-report.json').read_text())
          sources=json.loads(Path('unified-train/sources.json').read_text())
          counts=report.get('synthetic_and_source_counts',{})
          source_rows=int(counts.get('source_text',0))
          synthetic_rows=int(counts.get('synthetic',0))
          assert int(report['record_count']) > 0
          assert source_rows > 0, 'No non-synthetic source records found'
          assert sources.get('record_count')==report['record_count']
          # This historical artifact predates build-time filtering. Its rows retain
          # explicit synthetic flags; train_long_run.py filters them at ingestion.
          print(json.dumps({'all_rows_in_artifact':report['record_count'],'source_rows':source_rows,'synthetic_rows_present_but_excluded_by_training_loader':synthetic_rows,'datasets':len(report.get('datasets',{})),'source_files':len(sources.get('sources',[]))},ensure_ascii=False,indent=2))
          PY
      - name: Comprobar espacio e instalar PyTorch CPU
        run: |
          set -euo pipefail
          df -h .
          test "$(df --output=avail -k . | tail -1 | tr -d ' ')" -gt 8000000
          python -m pip install --upgrade pip
          python -m pip install numpy orjson
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Descargar y verificar checkpoint base de 760k (bytes UTF-8 + EOS)
        run: |
          set -euo pipefail
          mkdir -p train-150k/parent
          gh release download "$PARENT_TAG" --repo orbitalronin94/MINIRONIN --pattern "checkpoint-760000.pt" --dir train-150k/parent
          echo "$PARENT_SHA256  train-150k/parent/checkpoint-760000.pt" | sha256sum -c -
          python - <<'PY'
          import json, os, torch
          path="train-150k/parent/checkpoint-760000.pt"
          cp=torch.load(path,map_location="cpu",weights_only=False)
          assert cp.get("completed_steps")==760000, cp.get("completed_steps")
          assert cp.get("parameter_count")==9970176, cp.get("parameter_count")
          assert "model_state_dict" in cp and "optimizer_state_dict" in cp
          assert cp.get("active_vocabulary")==257, cp.get("active_vocabulary")
          assert "optimizer_state_dict" in cp
          tokenization=cp.get("tokenization","UTF-8 bytes + EOS")
          assert "byte" in tokenization.lower() or "utf-8" in tokenization.lower(), tokenization
          groups=cp["optimizer_state_dict"].get("param_groups",[])
          assert groups and 0<float(groups[0]["lr"])<=3e-4, groups
          lr=float(groups[0]["lr"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"parent_lr={lr:.12g}\n")
          print(json.dumps({"step":cp["completed_steps"],"parameters":cp["parameter_count"],
              "active_vocabulary":cp["active_vocabulary"],"tokenization":tokenization,"optimizer_lr":lr},indent=2))
          PY
        id: parent


      - name: Preflight completado; modo preflight no inicia entrenamiento
        if: inputs.mode == 'preflight'
        run: echo "Checkpoint 760k y corpus verificados. No se ha iniciado entrenamiento."

      - name: Entrenar 150k pasos y publicar cada checkpoint en vivo
        if: inputs.mode == 'train'
        run: |
          set -euo pipefail
          python -m py_compile scripts/train_long_run.py scripts/train_seed_tournament.py
          input="train-150k/parent/checkpoint-760000.pt"
          mkdir -p train-150k/current train-150k/checkpoints
          stop_file="$RUNNER_TEMP/stop-checkpoint-publisher"
          rm -f "$stop_file"
          (
            while [[ ! -f "$stop_file" ]]; do
              for end in $(seq 770000 10000 910000); do
                printf -v padded "%06d" "$end"
                checkpoint="train-150k/current/checkpoint-$padded.pt"
                report="train-150k/current/report-$padded.json"
                checksum="train-150k/current/checkpoint-$padded.sha256"
                marker="train-150k/checkpoints/published-$end"
                [[ -s "$checkpoint" && -s "$report" && -s "$checksum" && ! -f "$marker" ]] || continue
                cp "$checkpoint" "train-150k/checkpoints/checkpoint-$end.pt"
                cp "$report" "train-150k/checkpoints/report-$end.json"
                cp "$checksum" "train-150k/checkpoints/SHA256SUMS-$end"
                tag="minironin-legacy-150k-from-760k-nonsynthetic-step-$end"
                if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                  if ! gh release upload "$tag" "train-150k/checkpoints/checkpoint-$end.pt" "train-150k/checkpoints/report-$end.json" "train-150k/checkpoints/SHA256SUMS-$end" --repo "$GITHUB_REPOSITORY" --clobber; then
                    echo "WARN: publication failed for step $end; will retry"
                    continue
                  fi
                else
                  if ! gh release create "$tag" "train-150k/checkpoints/checkpoint-$end.pt" "train-150k/checkpoints/report-$end.json" "train-150k/checkpoints/SHA256SUMS-$end" --repo "$GITHUB_REPOSITORY" --title "MINIRONIN legacy tokenizer — step $end" --notes "Checkpoint emitted immediately after its 10k validation. Continuous continuation from verified step 760000; non-synthetic unified corpus only. Candidate; holdout required."; then
                    echo "WARN: release creation failed for step $end; will retry"
                    continue
                  fi
                fi
                touch "$marker"
                echo "Published checkpoint step $end"
              done
              sleep 10
            done
          ) &
          publisher_pid=$!
          set +e
          python scripts/train_long_run.py \
            --unified-corpus unified-train/train.jsonl.gz \
            --exclude-synthetic --allow-sparse-domains \
            --input-checkpoint "$input" \
            --output-dir train-150k/current \
            --start-step 760000 \
            --steps 150000 \
            --batch-size 4 \
            --sequence-length 128 \
            --threads 2 \
            --dataset-cache "$RUNNER_TEMP/minironin-unified-corpus-cache.pt" \
            --total-steps 910000 \
            --schedule-start-step 760000 \
            --schedule-start-lr "${{ steps.parent.outputs.parent_lr }}"
          train_status=$?
          set -e
          touch "$stop_file"
          wait "$publisher_pid" || true
          exit "$train_status"

      - name: Verificar y publicar candidato de 960k
        run: |
          set -euo pipefail
          cp train-150k/current/checkpoint-910000.pt train-150k/checkpoint-910000.pt
          cp train-150k/current/report-910000.json train-150k/report-910000.json
          sha256sum train-150k/checkpoint-910000.pt train-150k/report-910000.json > train-150k/SHA256SUMS-910000
          python - <<'PY'
          import json, torch
          cp=torch.load("train-150k/checkpoint-910000.pt",map_location="cpu",weights_only=False)
          report=json.load(open("train-150k/report-910000.json"))
          assert cp["completed_steps"]==910000 and cp["active_vocabulary"]==257
          assert report["completed_steps"]==910000
          print(json.dumps({"completed_steps":cp["completed_steps"],"parameters":cp["parameter_count"],
              "active_vocabulary":cp["active_vocabulary"],"validation_loss":report["validation_loss"],
              "validation_by_domain":report["validation_loss_by_domain"],
              "corpus":report["dataset_manifest"]},ensure_ascii=False,indent=2))
          PY
          gh release create "minironin-legacy-150k-from-760k-nonsynthetic-step-910000-candidate" \
            train-150k/checkpoint-910000.pt train-150k/report-910000.json train-150k/SHA256SUMS-910000 \
            --title "MINIRONIN legacy tokenizer — 150k continuation / step 910000" \
            --notes "150,000 additional steps from the verified 810k byte-level checkpoint, trained on all admitted non-synthetic rows in the previous lighter unified corpus artifact (run 42523463620; 776,739,403 bytes). Synthetic datasets explicitly excluded. Candidate only; no automatic promotion. Matched holdout required."

      - name: Conservar checkpoints parciales e informes incluso si falla el entrenamiento
        if: always() && inputs.mode == 'train'
        uses: actions/upload-artifact@v7
        with:
          name: minironin-legacy-vocab-150k-from-760k-nonsynthetic-${{ github.run_id }}
          path: train-150k/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
