name: MINIRONIN — 150k continuation from verified 810k with integrated RAG evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-150k-from-810k-unified.yml"
      - "scripts/prepare_integrated_training_corpus.py"
      - "scripts/train_long_run.py"
  workflow_dispatch:
    inputs:
      preparation_run_id:
        description: Successful run that produced minironin-integrated-evidence-stack
        required: true
        type: string
        default: "42682285328"

permissions:
  actions: read
  contents: write

concurrency:
  group: minironin-810k-150k-integrated-cpu
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: orbitalronin94/MINIRONIN
      PREPARATION_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.preparation_run_id || '42682285328' }}
      PARENT_TAG: minironin-full-corpus-step-810000
      PARENT_SHA256: 2d8ff48dc0645d4b2d83c2462bc33b88a1abade9354eb9289c265c7a5b13ca6b
      START_STEP: "810000"
      TOTAL_STEPS: "960000"
    steps:
      - name: Checkout MINIRONIN
        uses: actions/checkout@v5

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validar que la preparación integrada es la ejecución confirmada
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREPARATION_RUN_ID" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$REPOSITORY/actions/runs/$PREPARATION_RUN_ID")"
          [[ "$(jq -r .name <<<"$run")" == "Prepare MINIRONIN integrated evidence stack" ]]
          [[ "$(jq -r .status <<<"$run")" == "completed" ]]
          [[ "$(jq -r .conclusion <<<"$run")" == "success" ]]
          [[ "$(jq -r .head_branch <<<"$run")" == "main" ]]
          echo "Integrated evidence stack confirmed: run=$PREPARATION_RUN_ID sha=$(jq -r .head_sha <<<"$run")"
          releases="$(gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | grep '^minironin-full-corpus-150k-from-810k-step-' || true)"
          if [[ -n "$releases" ]]; then
            echo "A previous 810k continuation already published segments; refusing to overwrite or duplicate them."
            printf '%s\n' "$releases"
            exit 1
          fi

      - name: Descargar artefacto exacto RAG + biblioteca + filas despiertas + BPE candidato
        run: |
          set -euo pipefail
          mkdir -p integrated-evidence
          gh run download "$PREPARATION_RUN_ID" --repo "$REPOSITORY" \
            --name minironin-integrated-evidence-stack --dir integrated-evidence
          test -s integrated-evidence/integrated-manifest.json
          test -s integrated-evidence/library/canonical/documents.jsonl
          test -s integrated-evidence/awake-rows/train.jsonl
          test -s integrated-evidence/awake-rows/validation.jsonl
          test -s integrated-evidence/rag/minironin-rag.sqlite
          test -s integrated-evidence/tokenizer/backdoor-bpe.json

      - name: Construir proyección de entrenamiento con todos los documentos admitidos y awake rows
        run: |
          set -euo pipefail
          python -m py_compile scripts/prepare_integrated_training_corpus.py scripts/train_long_run.py scripts/train_seed_tournament.py
          python scripts/prepare_integrated_training_corpus.py \
            --stack integrated-evidence --output integrated-train/train.jsonl.gz
          test -s integrated-train/train.jsonl.gz
          test -s integrated-train/integrated-training-manifest.json
          python - <<'PY'
          import gzip,json,pathlib
          p=pathlib.Path("integrated-train/train.jsonl.gz")
          rows=sum(1 for _ in gzip.open(p,"rt",encoding="utf-8"))
          m=json.loads(pathlib.Path("integrated-train/integrated-training-manifest.json").read_text())
          assert rows == m["training_records"] and rows > 0
          assert m["admitted_source_documents"] > 0 and m["awake_training_rows"] > 0
          assert m["holdout_read"] is False and m["training_performed"] is False
          assert m["rag_index"]["chunks_unique"] > 0
          assert m["tokenizer_candidate"]["activated"] is False
          print(json.dumps({k:v for k,v in m.items() if k!="source_integrated_manifest"},ensure_ascii=False,indent=2))
          PY

      - name: Instalar PyTorch CPU y verificar recursos
        run: |
          set -euo pipefail
          df -h .
          test "$(df --output=avail -k . | tail -1 | tr -d ' ')" -gt 8000000
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Descargar y verificar checkpoint padre byte-tokenizer 810k
        id: parent
        run: |
          set -euo pipefail
          mkdir -p train-150k/parent train-150k/checkpoints train-150k/reports
          gh release download "$PARENT_TAG" --repo "$REPOSITORY" \
            --pattern "checkpoint-810000.pt" --dir train-150k/parent
          echo "$PARENT_SHA256  train-150k/parent/checkpoint-810000.pt" | sha256sum -c -
          python - <<'PY'
          import json,os,torch
          cp=torch.load("train-150k/parent/checkpoint-810000.pt",map_location="cpu",weights_only=False)
          assert cp.get("completed_steps")==810000
          assert cp.get("parameter_count")==9970176
          assert cp.get("active_vocabulary")==257
          assert "optimizer_state_dict" in cp
          tok=cp.get("tokenization","UTF-8 bytes + EOS")
          assert "byte" in tok.lower() or "utf-8" in tok.lower(),tok
          groups=cp["optimizer_state_dict"].get("param_groups",[])
          assert groups and 0<float(groups[0]["lr"])<=3e-4
          lr=float(groups[0]["lr"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write(f"parent_lr={lr:.12g}\n")
          print(json.dumps({"step":cp["completed_steps"],"parameters":cp["parameter_count"],"active_vocabulary":cp["active_vocabulary"],"tokenization":tok,"optimizer_lr":lr}))
          PY

      - name: Entrenar 150k pasos con validación y checkpoint cada 10k
        run: |
          set -euo pipefail
          input="train-150k/parent/checkpoint-810000.pt"
          for start in $(seq 810000 10000 950000); do
            end=$((start + 10000))
            echo "::group::MINIRONIN integrated admitted corpus — steps $((start + 1))-$end"
            python scripts/train_long_run.py \
              --unified-corpus integrated-train/train.jsonl.gz \
              --allow-sparse-domains \
              --input-checkpoint "$input" \
              --output-dir train-150k/current \
              --start-step "$start" --steps 10000 \
              --batch-size 4 --sequence-length 128 --threads 2 \
              --dataset-cache "$RUNNER_TEMP/minironin-810k-integrated-cache.pt" \
              --total-steps 960000 --schedule-start-step 810000 \
              --schedule-start-lr "${{ steps.parent.outputs.parent_lr }}"
            printf -v padded "%06d" "$end"
            checkpoint="train-150k/current/checkpoint-$padded.pt"
            report="train-150k/current/report-$padded.json"
            test -s "$checkpoint" && test -s "$report"
            cp "$checkpoint" "train-150k/checkpoints/checkpoint-$end.pt"
            cp "$report" "train-150k/reports/report-$end.json"
            sha256sum "train-150k/checkpoints/checkpoint-$end.pt" "train-150k/reports/report-$end.json" > "train-150k/checkpoints/SHA256SUMS-$end"
            python - "$checkpoint" "$report" "$end" <<'PY'
          import json,sys,torch
          cp=torch.load(sys.argv[1],map_location="cpu",weights_only=False)
          report=json.load(open(sys.argv[2],encoding="utf-8"))
          expected=int(sys.argv[3])
          assert cp.get("completed_steps")==expected
          assert report.get("completed_steps")==expected
          assert cp.get("parameter_count")==9970176 and cp.get("active_vocabulary")==257
          assert report.get("dataset_manifest",{}).get("unified_records_read",0)>0
          print(json.dumps({"checkpoint_step":expected,"parameters":cp["parameter_count"],"active_vocabulary":cp["active_vocabulary"],"validation_loss":report.get("validation_loss"),"validation_by_domain":report.get("validation_loss_by_domain"),"training_manifest":report["dataset_manifest"]},ensure_ascii=False))
          PY
            gh release create "minironin-full-corpus-150k-from-810k-step-$end" \
              "train-150k/checkpoints/checkpoint-$end.pt" \
              "train-150k/reports/report-$end.json" \
              "train-150k/checkpoints/SHA256SUMS-$end" \
              --title "MINIRONIN integrated admitted corpus — step $end" \
              --notes "10k continuation from pinned 810k byte-tokenizer checkpoint. Input: successful integrated evidence stack run $PREPARATION_RUN_ID. Training consumes all admitted canonical train documents plus evidence-conditioned awake train rows. RAG SQLite and candidate BPE are audited/preserved; BPE is not activated. Candidate only; matched independent holdout required."
            input="$checkpoint"
            echo "::endgroup::"
          done

      - name: Publicar candidato 960k y auditoría completa de RAG y corpus
        run: |
          set -euo pipefail
          cp train-150k/current/checkpoint-960000.pt train-150k/checkpoint-960000.pt
          cp train-150k/current/report-960000.json train-150k/report-960000.json
          cp integrated-train/integrated-training-manifest.json train-150k/reports/
          cp integrated-evidence/integrated-manifest.json train-150k/reports/
          cp integrated-evidence/library/canonical/manifest.json train-150k/reports/library-manifest.json
          cp integrated-evidence/tokenizer/backdoor-bpe.json train-150k/reports/backdoor-bpe-candidate.json
          cp integrated-evidence/rag/minironin-rag.sqlite train-150k/reports/minironin-rag.sqlite
          sha256sum train-150k/checkpoint-960000.pt train-150k/report-960000.json train-150k/reports/integrated-training-manifest.json train-150k/reports/minironin-rag.sqlite > train-150k/SHA256SUMS-960000
          gh release create "minironin-full-corpus-150k-from-810k-step-960000-candidate" \
            train-150k/checkpoint-960000.pt train-150k/report-960000.json train-150k/SHA256SUMS-960000 \
            train-150k/reports/integrated-training-manifest.json train-150k/reports/integrated-manifest.json \
            train-150k/reports/library-manifest.json train-150k/reports/backdoor-bpe-candidate.json \
            train-150k/reports/minironin-rag.sqlite \
            --title "MINIRONIN — integrated 150k continuation / step 960000 candidate" \
            --notes "150,000 steps from verified 810k parent. Training: all train-eligible admitted canonical documents plus evidence-conditioned awake rows from integrated evidence stack run $PREPARATION_RUN_ID. RAG index provenance included; no holdout data used. Byte tokenizer preserved (257 active IDs); BPE candidate kept separate and not activated. Candidate only; matched holdout required before promotion."

      - name: Publicar artefacto de auditoría por separado
        uses: actions/upload-artifact@v4
        with:
          name: minironin-integrated-rag-150k-audit-${{ github.run_id }}
          path: |
            train-150k/reports/
            train-150k/checkpoints/SHA256SUMS-*
            train-150k/parent/
            train-150k/SHA256SUMS-960000
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
