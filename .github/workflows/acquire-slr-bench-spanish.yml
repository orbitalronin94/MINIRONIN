name: MINIRONIN — admitir SLR-Bench español
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/acquire-slr-bench-spanish.yml"
      - "scripts/acquire_slr_bench_spanish.py"
permissions:
  contents: write
  actions: write
concurrency:
  group: minironin-acquire-slr-bench
  cancel-in-progress: false
jobs:
  acquire-and-admit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets==3.3.2" "huggingface_hub==0.29.3"
      - name: Resolve immutable revision and acquire train only
        run: |
          set -euo pipefail
          revision="$(git ls-remote https://huggingface.co/datasets/AIML-TUDA/SLR-Bench-Spanish refs/heads/main | awk 'NR==1 {print $1}')"
          test "${#revision}" -eq 40
          echo "SLR_REVISION=$revision" >> "$GITHUB_ENV"
          python scripts/acquire_slr_bench_spanish.py --revision "$revision"
      - name: Audit schema, split, license, IDs and digest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("data/curated/accepted")
          data=root/"slr-bench-spanish-v1-all-train.jsonl"
          m=json.loads((root/"slr-bench-spanish-v1-all-train.manifest.json").read_text())
          assert m["record_count"]==18053 and m["unique_source_ids"]==18053
          assert m["source_config"]=="v1-All" and m["source_split"]=="train"
          assert m["excluded_splits"]==["validation","test"] and m["license"]=="CC BY 4.0"
          assert hashlib.sha256(data.read_bytes()).hexdigest()==m["sha256_jsonl"]
          seen=set()
          for line in data.read_text(encoding="utf-8").splitlines():
              r=json.loads(line)
              assert r["language"]=="es" and r["split"]=="train" and r["train_eligible"]
              assert r["admission_status"]=="accepted" and r["synthetic"] is True
              assert r["license"]=="CC BY 4.0" and r["source_config"]=="v1-All"
              assert r["id"] not in seen and r["validation_program"] and r["answer"]
              seen.add(r["id"])
          assert len(seen)==18053
          print(json.dumps({"admitted":len(seen),"tiers":m["curriculum_tier_counts"],"sha256":m["sha256_jsonl"]},ensure_ascii=False))
          PY
      - name: Publish audited accepted SLR-Bench payload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: minironin-slr-bench-spanish-accepted
          path: |
            data/curated/accepted/slr-bench-spanish-v1-all-train.jsonl
            data/curated/accepted/slr-bench-spanish-v1-all-train.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
