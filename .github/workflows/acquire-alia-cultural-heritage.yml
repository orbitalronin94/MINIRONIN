name: MINIRONIN — admitir ALIA patrimonio cultural español
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/acquire-alia-cultural-heritage.yml"
      - "scripts/acquire_alia_cultural_heritage.py"
permissions:
  contents: write
  actions: write
concurrency:
  group: minironin-acquire-alia-heritage
  cancel-in-progress: false
jobs:
  acquire-and-admit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets==3.3.2" "huggingface_hub==0.29.3"
      - name: Resolve immutable upstream revision and stream curated Spanish corpus
        run: |
          set -euo pipefail
          revision="$(git ls-remote https://huggingface.co/datasets/SINAI/ALIA-es-cultural-heritage refs/heads/main | awk 'NR==1 {print $1}')"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "ALIA_REVISION=$revision" >> "$GITHUB_ENV"
          python scripts/acquire_alia_cultural_heritage.py --revision "$revision" --root .
      - name: Verify admission manifest and every JSONL record
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("data/curated/accepted")
          p=root/"alia-es-cultural-heritage-train.jsonl"
          m=json.loads((root/"alia-es-cultural-heritage-train.manifest.json").read_text())
          assert m["rows_admitted"]>0
          assert m["source_split"]=="train" and m["license"]=="CC BY-SA 4.0"
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["sha256_jsonl"]
          seen=set(); count=0
          for line in p.read_text(encoding="utf-8").splitlines():
              r=json.loads(line)
              assert r["language"]=="es" and r["split"]=="train" and r["train_eligible"]
              assert r["license"]=="CC BY-SA 4.0" and r["source_id"]
              assert not r["source_id"].casefold().startswith("wikipedia")
              assert r["admission_status"]=="accepted" and r["synthetic"] is False
              assert r["id"] not in seen
              seen.add(r["id"]); count+=1
          assert count==m["rows_admitted"]
          print(json.dumps({"admitted":count,"skipped_wikipedia":m["rows_skipped_wikipedia"],"skipped_duplicates":m["rows_skipped_exact_duplicates"],"source_ids":len(m["source_id_counts"]),"sha256":m["sha256_jsonl"]},ensure_ascii=False))
          PY
      - name: Publish audited ALIA payload and manifest as immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "ALIA Spanish Cultural Heritage — accepted corpus" --notes "CC BY-SA 4.0; Spanish-only, Wikipedia sources excluded, synthetic=false; source IDs and SHA-256 recorded in the manifest."
          fi
          gh release upload "$RELEASE_TAG" \
            data/curated/accepted/alia-es-cultural-heritage-train.jsonl \
            data/curated/accepted/alia-es-cultural-heritage-train.manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Rebuild unified training corpus after verified publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/build-unified-train.yml/dispatches" -f ref=main
