name: MINIRONIN — construir corpus unificado de entrenamiento

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-unified-train.yml"
      - ".github/workflows/train-150k-from-500k-unified.yml"
      - ".github/workflows/train-150k-from-650k-unified.yml"
      - ".github/workflows/train-150k-from-810k-nonsynthetic.yml"
      - "scripts/train_long_run.py"
      - "scripts/build_unified_train.py"
      - "scripts/audit_library_composition.py"
      - "data/curated/library-artifact-v2.json"
      - "scripts/acquire_japanese_library.py"
      - "scripts/acquire_aozora_japanese_originals.py"
      - "data/japan/SOURCES.json"
      - "scripts/generate_synthetic_curricula.py"
      - "scripts/generate_basic_curricula.py"
      - "scripts/build_abstention_datasets.py"
      - "scripts/build_personality_datasets.py"
      - "scripts/build_lexicon_dataset.py"
      - "scripts/generate_abstention_dataset.py"
      - "scripts/validate_lexicon_dataset.py"
      - "scripts/acquire_anarchist_library.py"
      - "scripts/acquire_classics_library.py"
      - "data/classics/SOURCES.json"
      - "data/anarchist/SOURCES.jsonl"
      - "data/curated/sources/LEXICON-DEL-ESPERPENTO-ALGORITMICO.md"
      - "data/inherited/wikimedia-es/**"
      - "data/curated/accepted/**"
      - "scripts/acquire_boe_legislation_es.py"
      - "scripts/acquire_common_corpus_spanish.py"
      - "scripts/acquire_slr_bench_spanish.py"
      - "scripts/acquire_alia_cultural_heritage.py"
      - "scripts/acquire_minerva_scientific_spanish.py"
      - "scripts/acquire_bne_hemeroteca_ocr_spanish.py"

permissions:
  contents: read

concurrency:
  group: minironin-unified-train-corpus-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout MINIRONIN
        uses: actions/checkout@v4

      - name: Importar los nueve artículos admitidos de Papers
        uses: actions/checkout@v4
        with:
          repository: orbitalronin94/Papers
          ref: d7bf3ae446f666ce3be73b11aab7090e1605a889
          path: papers-source
          persist-credentials: false

      - name: Preparar Python y dependencias de lectura
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pyarrow

      - name: Descargar y verificar HERETIC
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/releases/assets"
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936363" -o heretic-corpus.part-0
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936357" -o heretic-corpus.part-1
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936364" -o parts.sha256
          curl --fail --location --retry 4 --retry-all-errors -H "Accept: application/octet-stream" "$api/720936362" -o corpus.sha256
          test "$(stat -c%s heretic-corpus.part-0)" -eq 400000000
          test "$(stat -c%s heretic-corpus.part-1)" -eq 349837093
          sha256sum -c parts.sha256
          cat heretic-corpus.part-0 heretic-corpus.part-1 > heretic-approved-corpus.zip
          test "$(sha256sum heretic-approved-corpus.zip | awk '{print $1}')" = "$(awk '{print $1}' corpus.sha256)"
          unzip -tq heretic-approved-corpus.zip
          mkdir -p data/inherited/heretic-corpus
          unzip -q heretic-approved-corpus.zip -d data/inherited/heretic-corpus
          cp parts.sha256 corpus.sha256 data/inherited/heretic-corpus/

      - name: Descargar y verificar PRODATPHIL v0.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/orbitalronin94/MINIRONIN/releases/download/reasoning-library-prodatphil-v0.3/prodatphil_en_txt_0_3.zip" \
            -o prodatphil_en_txt_0_3.zip
          echo "8eacf44101c87772a842fce3d3ab415903f28ba7684f8b33eddba0e2489c13c9  prodatphil_en_txt_0_3.zip" | sha256sum -c -
          mkdir -p data/inherited/prodatphil-en-v0.3
          unzip -tq prodatphil_en_txt_0_3.zip
          unzip -q prodatphil_en_txt_0_3.zip -d data/inherited/prodatphil-en-v0.3

      - name: Adquirir bibliotecas anarquista, clásica y japonesa
        run: |
          set -euo pipefail
          python scripts/acquire_anarchist_library.py --output data/inherited/anarchist-library
          python scripts/acquire_classics_library.py --output data/inherited/classics-library
          python scripts/acquire_japanese_library.py --output data/inherited/japanese-library
          python scripts/acquire_aozora_japanese_originals.py --output data/inherited/japanese-library/aozora-originals --per-author 10 --max-works 160
          python - <<'PY'
          import json
          from pathlib import Path
          checks = [
            ("data/inherited/classics-library/CLASSICS-LIBRARY-MANIFEST.json", 8, "total_documents"),
            ("data/inherited/japanese-library/JAPANESE-LIBRARY-MANIFEST.json", 10, "total_documents"),
            ("data/inherited/japanese-library/aozora-originals/AOZORA-ORIGINALS-MANIFEST.json", 10, "total_documents"),
            ("data/inherited/anarchist-library/ANARCHIST-LIBRARY-MANIFEST.json", 2, "total_documents"),
          ]
          for name, minimum, key in checks:
              data=json.loads(Path(name).read_text())
              assert data[key] >= minimum, (name, data[key], minimum)
              print(name, data[key])
          PY

      - name: Recuperar la biblioteca Wikimedia ES de 100k con licencia y hashes
        run: |
          set -euo pipefail
          mkdir -p data/inherited/wikimedia-es
          base="https://github.com/orbitalronin94/MINIRONIN/releases/download/wikimedia-es-100k-v1"
          for file in wikipedia-es-100k.jsonl.gz WIKIMEDIA-ES-100K-MANIFEST.json README.md SHA256SUMS; do
            curl --fail --location --retry 4 --retry-all-errors "$base/$file" -o "data/inherited/wikimedia-es/$file"
          done
          (cd data/inherited/wikimedia-es && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          root=Path("data/inherited/wikimedia-es")
          manifest=json.loads((root/"WIKIMEDIA-ES-100K-MANIFEST.json").read_text())
          assert manifest["document_count"] == 100000
          assert manifest["unique_normalized_texts"] == 100000
          count=sum(1 for line in gzip.open(root/"wikipedia-es-100k.jsonl.gz","rt",encoding="utf-8") if line.strip())
          assert count == 100000, count
          print("WIKIMEDIA_ES_100K_VERIFIED", count)
          PY

      - name: Descargar shards PleIAs españoles admitidos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/inherited/pleias-spanish-pd-books
          if gh release view pleias-spanish-pd-books-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download pleias-spanish-pd-books-v1 --repo "$GITHUB_REPOSITORY" --dir data/inherited/pleias-spanish-pd-books --pattern 'spanish-pd-*.jsonl.gz' --pattern 'spanish-pd-*.manifest.json'
          fi

      - name: Descargar shards españoles admitidos de PleIAs Common Corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/inherited/common-corpus-es
          if gh release view pleias-common-corpus-spanish-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            assets="$(gh release view pleias-common-corpus-spanish-v1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if printf "%s\n" "$assets" | grep -q '^common-corpus-es-'; then
              gh release download pleias-common-corpus-spanish-v1 --repo "$GITHUB_REPOSITORY" --dir data/inherited/common-corpus-es --pattern "common-corpus-es-*.jsonl.gz" --pattern "common-corpus-es-*.manifest.json"
            else
              echo "Common Corpus release exists but no audited shard assets are published yet; the acquisition workflow will dispatch a later rebuild."
            fi
          fi


      - name: Descargar páginas BNE Hemeroteca OCR admitidas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/inherited/bne-hemeroteca-ocr-es
          if gh release view bne-hemeroteca-ocr-es-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download bne-hemeroteca-ocr-es-v1 --repo "$GITHUB_REPOSITORY" --dir data/inherited/bne-hemeroteca-ocr-es --pattern "bne-ocr-es-*.jsonl.gz" --pattern "bne-ocr-es-*.manifest.json"
          fi

      - name: Descargar y verificar ALIA biomédico español admitido
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/inherited/alia-biomedical-es
          if gh release view alia-biomedical-es-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            assets="$(gh release view alia-biomedical-es-v1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if printf "%s\n" "$assets" | grep -q '^alia-biomedical-es-part-'; then
              gh release download alia-biomedical-es-v1 --repo "$GITHUB_REPOSITORY" --dir data/inherited/alia-biomedical-es --pattern "alia-biomedical-es-part-*.jsonl.gz" --pattern "alia-biomedical-es.manifest.json"
          python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          root=Path("data/inherited/alia-biomedical-es")
          m=json.loads((root/"alia-biomedical-es.manifest.json").read_text())
          assert m["synthetic"] is False and m["license"]=="CC BY-SA 4.0"
          assert m["rows_admitted"]>=5_000_000
          total=0
          for item in m["files"]:
              p=root/item["file"];h=hashlib.sha256();rows=0
              with p.open("rb") as f:
                  for block in iter(lambda:f.read(1024*1024),b""):h.update(block)
              assert h.hexdigest()==item["sha256_gzip"] and p.stat().st_size==item["bytes"]
              with gzip.open(p,"rt",encoding="utf-8") as f:
                  for line in f:
                      r=json.loads(line)
                      assert r["language"]=="es" and r["train_eligible"] and r["admission_status"]=="accepted"
                      assert r["license"]=="CC BY-SA 4.0" and r["synthetic"] is False
                      assert r["source_revision"]==m["source_revision"]
                      rows+=1
              assert rows==item["rows"]
              total+=rows
          assert total==m["rows_admitted"]
          print("ALIA_BIOMEDICAL_VERIFIED",total,len(m["files"]))
          PY
            else
              echo "ALIA biomedical release exists but no admitted shard assets are published."
            fi
          fi

      - name: Descargar legislación consolidada vigente del BOE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/inherited/boe-legislation-es
          if gh release view boe-legislation-es-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            assets="$(gh release view boe-legislation-es-v1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if printf "%s\n" "$assets" | grep -q '^boe-legislation-es-'; then
              gh release download boe-legislation-es-v1 --repo "$GITHUB_REPOSITORY" --dir data/inherited/boe-legislation-es --pattern "boe-legislation-es-*.jsonl.gz" --pattern "boe-legislation-es-*.manifest.json"
            else
              echo "BOE release exists but has no audited batches yet; the post-acquisition dispatch will rebuild."
            fi
          fi
      - name: Copiar exactamente los nueve artículos Markdown admitidos de Papers
        run: |
          set -euo pipefail
          mkdir -p data/inherited/papers
          python - <<'PY'
          from pathlib import Path
          from shutil import copy2
          source = Path("papers-source")
          if not source.is_dir():
              raise SystemExit(f"Papers checkout missing: {source.resolve()}")
          files = sorted(p for p in source.glob("*.md") if p.name.lower() != "readme.md")
          print("Papers source Markdown:", [p.name for p in files])
          if len(files) != 9:
              raise SystemExit(f"Expected exactly 9 admitted Papers Markdown files, found {len(files)}")
          for path in files:
              copy2(path, Path("data/inherited/papers") / path.name)
          print(f"Copied {len(files)} Papers Markdown documents")
          PY

      - name: Descargar y admitir bibliotecas españolas SLR y ALIA sin meter payloads grandes en Git
        run: |
          set -euo pipefail
          python -m pip install "datasets==3.3.2" "huggingface_hub==0.29.3"
          mkdir -p data/curated/accepted
          slr_revision="$(git ls-remote https://huggingface.co/datasets/AIML-TUDA/SLR-Bench-Spanish refs/heads/main | awk 'NR==1 {print $1}')"
          test "${#slr_revision}" -eq 40
          python scripts/acquire_slr_bench_spanish.py --revision "$slr_revision" --output-dir data/curated/accepted
          alia_revision="$(git ls-remote https://huggingface.co/datasets/SINAI/ALIA-es-cultural-heritage refs/heads/main | awk 'NR==1 {print $1}')"
          test "${#alia_revision}" -eq 40
          python scripts/acquire_alia_cultural_heritage.py --revision "$alia_revision" --root . --output-dir data/curated/accepted
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/curated/accepted")
          for name in ("slr-bench-spanish-v1-all-train.manifest.json","alia-es-cultural-heritage-train.manifest.json"):
              m=json.loads((root/name).read_text())
              print(name, {k:m.get(k) for k in ("record_count","rows_admitted","unique_source_ids","license","source_revision")})
          PY
          rm -rf "$HOME/.cache/huggingface/datasets" "$HOME/.cache/huggingface/hub"
      - name: Descargar y admitir Minerva científico español
        run: |
          set -euo pipefail
          minerva_revision="$(git ls-remote https://huggingface.co/datasets/proxectonos/corpus_dominio_cientifico refs/heads/main | awk 'NR==1 {print $1}')"
          test "${#minerva_revision}" -eq 40
          python scripts/acquire_minerva_scientific_spanish.py --revision "$minerva_revision" --root . --output-dir data/curated/accepted
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/curated/accepted/minerva-scientific-es-train.manifest.json").read_text())
          print(json.dumps({k:m.get(k) for k in ("source_rows_scanned","rows_admitted","rows_skipped_exact_duplicates","license_scope")},ensure_ascii=False))
          PY

      - name: Construir biblioteca admitida desde el artefacto canónico
        run: |
          set -euo pipefail
          python scripts/build_unified_train.py --library-manifest data/curated/library-artifact-v2.json --output-dir unified-train
          python scripts/audit_library_composition.py --input unified-train/train.jsonl.gz --output unified-train/composition-by-matter.json
          sha256sum unified-train/composition-by-matter.json >> unified-train/SHA256SUMS
          (cd unified-train && sha256sum -c SHA256SUMS)
          cat unified-train/quality-report.json
          cat unified-train/composition-by-matter.json
      - name: Publicar el único artefacto unificado de entrenamiento
        uses: actions/upload-artifact@v4
        with:
          name: minironin-unified-train-corpus-${{ github.run_id }}
          path: unified-train/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
