name: Build complete MINIRONIN RAG index

on:
  workflow_dispatch:
    inputs:
      embeddings:
        description: Build multilingual E5 vectors in addition to BM25
        type: boolean
        required: true
        default: true
      include_heretic:
        description: Download and index the approved HERETIC corpus artifact
        type: boolean
        required: true
        default: true
      include_roninia:
        description: Checkout and index RONIN-IA data/datasets
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: minironin-rag-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: inputs.include_heretic
        with:
          name: minironin-heretic-corpus-prepared
          repository: orbitalronin94/MINIRONIN
          run-id: 42382055693
          github-token: ${{ github.token }}
          path: external/heretic-artifact

      - uses: actions/checkout@v4
        if: inputs.include_roninia
        with:
          repository: orbitalronin94/RONIN-IA
          ref: main
          path: external/roninia
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install RAG dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-rag.txt

      - name: Materialize deterministic project-authored libraries
        run: |
          python scripts/build_abstention_datasets.py
          python scripts/build_personality_datasets.py
          python scripts/build_lexicon_dataset.py

      - name: Verify all selected source roots exist
        env:
          INCLUDE_HERETIC: ${{ inputs.include_heretic }}
          INCLUDE_RONINIA: ${{ inputs.include_roninia }}
        run: |
          if [ "$INCLUDE_HERETIC" = "true" ]; then
            test -d external/heretic-artifact/data/inherited/heretic-corpus
            test -f external/heretic-artifact/data/inherited/heretic-corpus/OPEN-SOURCE-MANIFEST.json
          fi
          if [ "$INCLUDE_RONINIA" = "true" ]; then
            test -d external/roninia/data/datasets
          fi

      - name: Build complete approved index
        env:
          EMBEDDINGS: ${{ inputs.embeddings }}
          INCLUDE_HERETIC: ${{ inputs.include_heretic }}
          INCLUDE_RONINIA: ${{ inputs.include_roninia }}
        run: |
          args=(--output artifacts/rag/minironin-rag.sqlite)
          if [ "$EMBEDDINGS" != "true" ]; then args+=(--no-embeddings); fi
          if [ "$INCLUDE_HERETIC" = "true" ]; then args+=(--root "HERETIC=external/heretic-artifact/data/inherited/heretic-corpus"); fi
          if [ "$INCLUDE_RONINIA" = "true" ]; then args+=(--root "RONIN_IA=external/roninia/data/datasets"); fi
          python scripts/build_rag_index.py "${args[@]}"

      - name: Verify database and write manifest
        run: |
          python - <<'PY'
          import sqlite3,json,hashlib,os
          p="artifacts/rag/minironin-rag.sqlite"
          db=sqlite3.connect(p)
          m=json.loads(db.execute("select value from metadata where key='manifest'").fetchone()[0])
          assert db.execute("select count(*) from chunks").fetchone()[0]==m["chunks_unique"]
          assert m["chunks_unique"]>0
          m["sqlite_bytes"]=os.path.getsize(p)
          h=hashlib.sha256()
          with open(p,"rb") as f:
            for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
          m["sqlite_sha256"]=h.hexdigest()
          with open("artifacts/rag/manifest.json","w") as f:
            json.dump(m,f,ensure_ascii=False,indent=2)
            f.write("\n")
          print(json.dumps(m,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: minironin-complete-rag-index
          path: artifacts/rag/
          if-no-files-found: error
          retention-days: 30
