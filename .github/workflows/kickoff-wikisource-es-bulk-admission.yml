name: MINIRONIN — iniciar admisión masiva Wikisource ES (37.200 textos)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kickoff-wikisource-es-bulk-admission.yml"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: minironin-wikisource-es-bulk-kickoff
  cancel-in-progress: false
jobs:
  dispatch-first-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Start deterministic first batch; validated auto-merge chains batches 2–31
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/wikisource-es-1200-batch.yml/dispatches" -f ref=main -f 'inputs[batch_index]=1'
          echo "Dispatched batch 1/31. Each validated 1,200-document PR is auto-merged before the next batch is dispatched; the final batch triggers the unified corpus build."
