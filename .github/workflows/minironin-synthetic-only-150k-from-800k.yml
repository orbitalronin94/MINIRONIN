name: MINIRONIN — 150k desde 800k con corpus completo (cadena de 10k)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/minironin-synthetic-only-150k-from-800k.yml"
  workflow_dispatch:
    inputs:
      start_step:
        description: "Checkpoint de inicio (800000–940000)"
        required: true
        default: "800000"
        type: string
      previous_run_id:
        description: "Run anterior con corpus/cache; 0 solo para el primer segmento"
        required: true
        default: "0"
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: minironin-full-corpus-800k-to-950k
  cancel-in-progress: false

jobs:
  train-segment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      START_STEP: ${{ github.event_name == 'workflow_dispatch' && inputs.start_step || '800000' }}
      PREVIOUS_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_run_id || '0' }}
      BASE_RUN_ID: "42627788882"
      BASE_ARTIFACT_NAME: "minironin-holdout-only-800000"
      BASE_CHECKPOINT_SHA256: "37c89e8cf696e57fadbec4f0fcfefe65153628ae91565aff8ed256a650605485"
      CORPUS_RUN_ID: "42523463620"
      CORPUS_ARTIFACT_NAME: "minironin-unified-train-corpus-42523463620"
      CORPUS_ARTIFACT_SHA256: "e02fa1240a0457310cacf1406f641c720942a41abc48d83f3e4c730506b691fc"
      TOTAL_STEPS: "950000"
    steps:
      - name: Checkout MINIRONIN
        uses: actions/checkout@v4

      - name: Validar segmento e instalar PyTorch CPU
        run: |
          set -euo pipefail
          [[ "$START_STEP" =~ ^[0-9]+$ ]]
          [[ "$PREVIOUS_RUN_ID" =~ ^[0-9]+$ ]]
          test "$START_STEP" -ge 800000
          test "$START_STEP" -lt 950000
          test "$((START_STEP % 10000))" -eq 0
          python --version
          df -h .
          test "$(df --output=avail -k . | tail -1 | tr -d ' ')" -gt 8000000
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          echo "END_STEP=$((START_STEP + 10000))" >> "$GITHUB_ENV"

      - name: Recuperar checkpoint base exacto de 800k
        if: env.START_STEP == '800000'
        uses: actions/download-artifact@v4
        with:
          name: minironin-holdout-only-800000
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42627788882
          path: train-150k/parent

      - name: Recuperar corpus unificado completo (todas las bibliotecas y datasets)
        if: env.START_STEP == '800000'
        uses: actions/download-artifact@v4
        with:
          name: minironin-unified-train-corpus-42523463620
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42523463620
          path: train-150k/state/unified-train

      - name: Verificar corpus completo e integridad de fuentes
        if: env.START_STEP == '800000'
        run: |
          set -euo pipefail
          test -s train-150k/state/unified-train/train.jsonl.gz
          test -s train-150k/state/unified-train/sources.json
          test -s train-150k/state/unified-train/quality-report.json
          test -s train-150k/state/unified-train/SHA256SUMS
          (cd train-150k/state/unified-train && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("train-150k/state/unified-train/quality-report.json").read_text())
          sources=json.loads(Path("train-150k/state/unified-train/sources.json").read_text())
          rows=int(report["record_count"])
          datasets=report.get("datasets",{})
          source_files=sources.get("sources",[])
          assert rows >= 2_900_000, f"Corpus incompleto: {rows:,} filas"
          assert len(datasets) >= 64, f"Faltan datasets: {len(datasets)}"
          assert len(source_files) >= 64, f"Faltan fuentes: {len(source_files)}"
          assert sources.get("record_count",rows)==rows
          print(json.dumps({
            "records":rows,"datasets":len(datasets),"source_files":len(source_files),
            "synthetic_and_source_counts":report.get("synthetic_and_source_counts"),
            "domains":report.get("domains"),
            "duplicates_reported":report.get("exact_or_normalized_duplicates_reported_not_removed"),
            "corpus_sha256":sources.get("train_jsonl_gz_sha256")
          },ensure_ascii=False,indent=2))
          PY
          echo "$CORPUS_ARTIFACT_SHA256  $RUNNER_TEMP/corpus-artifact.zip" > /dev/null

      - name: Verificar checkpoint padre 800k
        if: env.START_STEP == '800000'
        run: |
          set -euo pipefail
          test -s train-150k/parent/checkpoint-800000.pt
          echo "$BASE_CHECKPOINT_SHA256  train-150k/parent/checkpoint-800000.pt" | sha256sum -c -
          python - <<'PY'
          import torch
          p="train-150k/parent/checkpoint-800000.pt"
          c=torch.load(p,map_location="cpu",weights_only=False)
          assert c.get("completed_steps")==800000
          assert c.get("parameter_count")==9970176
          assert c.get("active_vocabulary")==257
          assert "optimizer_state_dict" in c
          print("Verified base:",c["completed_steps"],c["parameter_count"],c["active_vocabulary"])
          PY

      - name: Recuperar corpus/cache del segmento anterior
        if: env.START_STEP != '800000'
        uses: actions/download-artifact@v4
        with:
          name: minironin-full-corpus-150k-${{ env.PREVIOUS_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(env.PREVIOUS_RUN_ID) }}
          path: train-150k/state

      - name: Descargar checkpoint del release anterior
        if: env.START_STEP != '800000'
        run: |
          set -euo pipefail
          mkdir -p train-150k/parent
          gh release download "minironin-full-corpus-step-$START_STEP" \
            --repo orbitalronin94/MINIRONIN --pattern "checkpoint-$START_STEP.pt" \
            --dir train-150k/parent

      - name: Extraer LR del optimizador y verificar checkpoint de reanudación
        id: parent
        run: |
          set -euo pipefail
          if [ "$START_STEP" = "800000" ]; then
            input="train-150k/parent/checkpoint-800000.pt"
          else
            input="train-150k/parent/checkpoint-$START_STEP.pt"
          fi
          test -s "$input"
          python - "$input" "$START_STEP" "$GITHUB_OUTPUT" <<'PY'
          import sys,torch
          path,expected,out=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          c=torch.load(path,map_location="cpu",weights_only=False)
          assert c.get("completed_steps")==expected
          assert c.get("parameter_count")==9970176
          assert c.get("active_vocabulary")==257
          assert "optimizer_state_dict" in c
          groups=c["optimizer_state_dict"].get("param_groups",[])
          assert groups and 0<float(groups[0]["lr"])<=3e-4
          lr=float(groups[0]["lr"])
          with open(out,"a") as f:f.write(f"parent_lr={lr:.12g}\\n")
          print({"step":expected,"parameters":c["parameter_count"],"lr":lr})
          PY
          if [ "$START_STEP" != "800000" ]; then
            (cd train-150k/state/unified-train && sha256sum -c SHA256SUMS)
          fi

      - name: Entrenar exactamente 10k pasos con TODO el corpus
        run: |
          set -euo pipefail
          python -m py_compile scripts/train_long_run.py scripts/train_seed_tournament.py
          if [ "$START_STEP" = "800000" ]; then
            input="train-150k/parent/checkpoint-800000.pt"
          else
            input="train-150k/parent/checkpoint-$START_STEP.pt"
          fi
          mkdir -p train-150k/current
          python scripts/train_long_run.py \
            --unified-corpus train-150k/state/unified-train/train.jsonl.gz \
            --input-checkpoint "$input" \
            --output-dir train-150k/current \
            --start-step "$START_STEP" \
            --steps 10000 \
            --batch-size 4 \
            --sequence-length 128 \
            --threads 2 \
            --dataset-cache train-150k/state/cache.pt \
            --total-steps 950000 \
            --schedule-start-step 800000 \
            --schedule-start-lr "${{ steps.parent.outputs.parent_lr }}"
          checkpoint="train-150k/current/checkpoint-$END_STEP.pt"
          report="train-150k/current/report-$END_STEP.json"
          test -s "$checkpoint" && test -s "$report"
          cp "$checkpoint" "train-150k/checkpoint-$END_STEP.pt"
          cp "$report" "train-150k/report-$END_STEP.json"
          sha256sum "train-150k/checkpoint-$END_STEP.pt" "train-150k/report-$END_STEP.json" > "train-150k/SHA256SUMS-$END_STEP"
          python - "$checkpoint" "$report" "$END_STEP" <<'PY'
          import json,sys,torch
          c=torch.load(sys.argv[1],map_location="cpu",weights_only=False)
          r=json.load(open(sys.argv[2]))
          e=int(sys.argv[3])
          assert c["completed_steps"]==e and r["completed_steps"]==e
          assert c["active_vocabulary"]==257 and c["parameter_count"]==9970176
          print(json.dumps({"step":e,"validation_loss":r["validation_loss"],
            "validation_by_domain":r["validation_loss_by_domain"],
            "corpus":r["dataset_manifest"]},ensure_ascii=False,indent=2))
          PY

      - name: Publicar checkpoint como candidato sin promoción
        run: |
          set -euo pipefail
          gh release create "minironin-full-corpus-step-$END_STEP" \
            "train-150k/checkpoint-$END_STEP.pt" \
            "train-150k/report-$END_STEP.json" \
            "train-150k/SHA256SUMS-$END_STEP" \
            --repo orbitalronin94/MINIRONIN \
            --title "MINIRONIN full corpus — step $END_STEP" \
            --notes "10k steps from verified parent checkpoint. Reused complete unified corpus artifact from run 42523463620: all admitted datasets/libraries, not synthetic-only. Candidate only; independent holdout required; no main promotion."

      - name: Conservar corpus y cache para el siguiente tramo
        uses: actions/upload-artifact@v4
        with:
          name: minironin-full-corpus-150k-${{ github.run_id }}
          path: train-150k/state/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Encadenar el siguiente segmento de 10k
        if: success() && env.END_STEP != '950000'
        run: |
          set -euo pipefail
          gh workflow run minironin-synthetic-only-150k-from-800k.yml \
            --repo orbitalronin94/MINIRONIN --ref main \
            -f start_step="$END_STEP" \
            -f previous_run_id="$GITHUB_RUN_ID"
