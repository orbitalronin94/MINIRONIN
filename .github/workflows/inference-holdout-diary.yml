name: MINIRONIN — inference holdout diary
# Batch backfill enabled; this commit also kicks off the initial baseline + checkpoint comparison.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inference-holdout-diary.yml"
      - "scripts/run_inference_holdout.py"
      - "benchmarks/inference-holdout-v1.jsonl"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: minironin-inference-holdout-diary
  cancel-in-progress: false

jobs:
  evaluate-unseen-checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: orbitalronin94/MINIRONIN
      BASE_RELEASE: seed-tournament-42383056882
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Evaluate the fixed pre-training base first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmarks/diary .tmp/inference
          if [[ ! -f benchmarks/diary/base.json ]]; then
            gh release download "$BASE_RELEASE" --repo "$REPOSITORY" \
              --pattern "best-checkpoint.pt" --dir .tmp/inference
            python scripts/run_inference_holdout.py \
              --checkpoint .tmp/inference/best-checkpoint.pt \
              --label base-seed-9519-before-long-training \
              --steps 100 \
              --holdout benchmarks/inference-holdout-v1.jsonl \
              --output benchmarks/diary/base.json \
              --threads 2
          else
            echo "Base diary already exists; preserving the original baseline."
          fi

      - name: Evaluate every published checkpoint without a diary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/inference benchmarks/diary
          mapfile -t tags < <(
            gh release list --repo "$REPOSITORY" --limit 100 --json tagName \
              --jq '.[].tagName' \
              | grep -E '^long-train-step-[0-9]+$' \
              | sort -V
          )
          evaluated=0
          for tag in "${tags[@]}"; do
            step="${tag#long-train-step-}"
            output="benchmarks/diary/checkpoint-${step}.json"
            if [[ -f "$output" ]]; then
              echo "Already evaluated: $tag"
              continue
            fi

            echo "Evaluating $tag against the immutable base holdout."
            gh release download "$tag" --repo "$REPOSITORY" \
              --pattern "checkpoint-${step}.pt" --dir .tmp/inference
            checkpoint=".tmp/inference/checkpoint-${step}.pt"
            python scripts/run_inference_holdout.py \
              --checkpoint "$checkpoint" \
              --label "$tag" \
              --steps "$step" \
              --holdout benchmarks/inference-holdout-v1.jsonl \
              --base-diary benchmarks/diary/base.json \
              --output "$output" \
              --threads 2
            evaluated=$((evaluated + 1))
          done
          echo "New checkpoints evaluated in this run: $evaluated"

      - name: Refresh human-readable diary index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("benchmarks/diary")
          rows = []
          paths = sorted(
              root.glob("*.json"),
              key=lambda p: (
                  p.name != "base.json",
                  int(p.stem.split("-")[-1]) if p.stem.startswith("checkpoint-") else -1,
              ),
          )
          for path in paths:
              data = json.loads(path.read_text(encoding="utf-8"))
              comparison = data.get("comparison_to_base") or {}
              rows.append({
                  "label": data["label"],
                  "steps": data["completed_steps"],
                  "count": data["holdout_count"],
                  "sha": data["checkpoint_sha256"],
                  "holdout_sha": data["holdout_sha256"],
                  "date": data["created_at_utc"],
                  "changed": comparison.get("changed_answers", "—"),
                  "change_rate": comparison.get("answer_change_rate", "—"),
                  "file": path.name,
              })
          lines = [
              "# MINIRONIN — diario de inferencia",
              "",
              "Todos los modelos se evalúan con los mismos IDs, prompts, generación greedy y holdout SHA-256.",
              "«Respuestas cambiadas» mide diferencia literal frente a base, no calidad.",
              "No hay puntuación automática de inteligencia: requiere revisión humana ciega.",
              "",
              "| Modelo | Pasos | Preguntas | Respuestas distintas vs base | Tasa de cambio | SHA-256 checkpoint | SHA-256 holdout | Diario |",
              "|---|---:|---:|---:|---:|---|---|---|",
          ]
          for row in rows:
              rate = f'{row["change_rate"]:.1%}' if isinstance(row["change_rate"], (int, float)) else row["change_rate"]
              lines.append(
                  f'| {row["label"]} | {row["steps"]} | {row["count"]} | '
                  f'{row["changed"]} | {rate} | `{row["sha"]}` | '
                  f'`{row["holdout_sha"]}` | [{row["file"]}]({row["file"]}) |'
              )
          (root / "index.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit diary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/diary
          if git diff --cached --quiet; then
            echo "Diary unchanged."
            exit 0
          fi
          git commit -m "Record MINIRONIN inference holdout diary"
          git pull --rebase origin main
          git push origin HEAD:main
