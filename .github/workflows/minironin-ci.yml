name: MINIRONIN independent CI

on:
  push:
    branches: [main, "prep/wikisource-es-1200-batch-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout MINIRONIN
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest
      - name: Run architecture tests
        run: python -m pytest -q
      - name: Validate canonical library builder and manifest
        run: |
          python -m py_compile scripts/build_unified_train.py scripts/audit_library_composition.py
          python -m json.tool data/curated/library-artifact-v2.json >/dev/null
      - name: Smoke-test independent training benchmark
        run: >-
          python scripts/benchmark_training.py
          --device cpu --steps 1 --warmup 0
          --contexts 8 --batches 1 --threads 1
          --output /tmp/minironin-benchmark-smoke.json
